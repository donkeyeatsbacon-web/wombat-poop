<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💩 Combat Wombat 💩</title>
<link rel="stylesheet" href="shared/base.css?v=30c6dc38">
<style>
  html, body { touch-action: manipulation; }
  #wrap { flex-direction: column; justify-content: safe center; gap: 14px; padding: 16px; overflow-y: auto; }
  h1 {
    font-size: clamp(30px, 8vw, 48px); color: #fff; text-align: center; line-height: 1.1;
    text-shadow: 0 3px 0 #2d5016, 0 0 18px rgba(0,0,0,.25);
  }
  .tag { color: #2d5016; font-size: 18px; text-align: center; margin-top: -6px; }
  #wombat {
    width: 200px; height: 170px; background: none; box-shadow: none; border-radius: 0;
  }
  .modes { display: flex; flex-direction: column; gap: 14px; width: min(420px, 100%); }
  .mode {
    display: block; text-decoration: none; color: #5a2d0c;
    background: #fff8e7; border: 4px solid #7a3d12; border-radius: 18px;
    box-shadow: 0 6px 0 #7a3d12, 0 12px 26px rgba(0,0,0,.25);
    padding: 16px 20px; transition: transform .08s;
  }
  .mode:hover { transform: translateY(-2px); }
  .mode:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a3d12, 0 6px 14px rgba(0,0,0,.25); }
  .mode:focus-visible { outline: 4px solid #ffe14d; outline-offset: 3px; }
  .mode .name { font-size: 26px; font-weight: bold; }
  .mode .what { font-size: 16px; margin-top: 4px; color: #7a3d12; }
  .mode .status { font-size: 15px; margin-top: 8px; color: #14532d; font-weight: bold; }
  .mode .status:empty { display: none; }
  #sound {
    position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    font: inherit; font-size: 16px; font-weight: bold; color: #2d5016; cursor: pointer;
    background: rgba(255,255,255,.78); border: 3px solid #2d5016; border-radius: 999px; padding: 6px 14px;
  }
  #sound:focus-visible { outline: 4px solid #ffe14d; outline-offset: 2px; }
</style>
</head>
<body>
<button id="sound" type="button"></button>
<div id="wrap">
  <h1>💩 Combat Wombat 💩</h1>
  <div class="tag">Catch the plops. Stack 'em high.</div>
  <canvas id="wombat" aria-hidden="true"></canvas>
  <nav class="modes">
    <a class="mode" href="wombat-poop.html">
      <div class="name">🗼 Endless</div>
      <div class="what">Stack as high as you can before the tower topples.</div>
      <div class="status" id="endlessStatus"></div>
    </a>
    <a class="mode" href="wombat-campaign.html">
      <div class="name">🗺 Campaign</div>
      <div class="what">A season in your territory: woo mates, out-stack rivals.</div>
      <div class="status" id="campaignStatus"></div>
    </a>
  </nav>
</div>
<script src="shared/core.js?v=f6589e31"></script>
<script src="shared/sound.js?v=945a409e"></script>
<script src="shared/art.js?v=c54f25b5"></script>
<script>
(() => {
  // what's saved, so each mode can say where you're up to
  const read = key => { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){ return null; } };
  const high = read('wombatPoopHigh');
  if(high && high.score > 0)
    document.getElementById('endlessStatus').textContent = '🏆 Best: ' + high.score + (high.name ? ' (' + high.name + ')' : '');
  const save = read('wombatCampaignSave');
  if(save && save.player && Number.isFinite(save.player.day))
    document.getElementById('campaignStatus').textContent = '▶ Continue — Day ' + save.player.day;

  // sound on/off, shared with both modes
  const soundBtn = document.getElementById('sound');
  const showSound = () => {
    const off = WB.sound.muted();
    soundBtn.textContent = off ? '🔇 Sound off' : '🔊 Sound on';
    soundBtn.setAttribute('aria-pressed', String(!off));
  };
  soundBtn.addEventListener('click', () => { WB.sound.toggle(); showSound(); });
  showSound();

  // the wombat, shuffling about
  const cv = document.getElementById('wombat'), ctx = cv.getContext('2d');
  const CW = 200, CH = 170;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = CW * dpr; cv.height = CH * dpr;
  let t = 0;
  const { drawWombatArt } = WB.createArt(ctx, () => t);
  WB.runLoop(() => { t++; }, () => {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
    const crawl = t * 0.1;
    drawWombatArt({ x: CW/2, y: 92 + Math.sin(crawl)*2, face: Math.sin(t*0.015)*0.8, strain: 0,
      crawl, wob: Math.sin(crawl)*3, mode: 'crawl', timer: 0, blink: (t % 200) < 8 ? 1 : 0 },
      1, WB.PAL_PLAYER, {});
  });
})();
</script>
</body>
</html>

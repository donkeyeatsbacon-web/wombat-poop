<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💩 Combat Wombat: Poop Stacker 💩</title>
<link rel="stylesheet" href="shared/base.css?v=30c6dc38">
<style>
  canvas { image-rendering: optimizeQuality; }
  #hint { font-size: 14px; }
  #saveOverlay {
    position: absolute; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35);
  }
  #saveBox {
    background: #fff8e7; border: 4px solid #7a3d12; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
    padding: 26px 30px; text-align: center; max-width: 88%;
    color: #5a2d0c;
  }
  #saveTitle { font-size: 30px; font-weight: bold; color: #c9860a; }
  #saveSub   { font-size: 18px; margin: 8px 0 16px; color: #7a3d12; }
  #nameEntry {
    font-family: inherit; font-size: 24px; text-align: center;
    padding: 8px 12px; width: 240px; max-width: 100%;
    border: 3px solid #7a3d12; border-radius: 10px; background: #fff;
    color: #5a2d0c; outline: none;
  }
  #saveBtns { margin-top: 18px; display: flex; gap: 12px; justify-content: center; }
  #saveBtns button {
    font-family: inherit; font-size: 20px; font-weight: bold;
    padding: 10px 22px; border-radius: 12px; border: 3px solid #4a7a25;
    cursor: pointer;
  }
  #saveBtn  { background: #7bed9f; color: #14532d; }
  #skipBtn  { background: #eee; color: #555; border-color: #999; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="720" height="960"></canvas></div>
<div id="hint"></div>
<div id="saveOverlay">
  <div id="saveBox">
    <div id="saveTitle">🏆 New personal best!</div>
    <div id="saveSub"></div>
    <input id="nameEntry" maxlength="12" placeholder="Your name" autocomplete="off" spellcheck="false" />
    <div id="saveBtns">
      <button id="saveBtn">Save</button>
      <button id="skipBtn">Skip</button>
    </div>
  </div>
</div>
<script src="shared/core.js?v=f6589e31"></script>
<script src="shared/sound.js?v=945a409e"></script>
<script src="shared/art.js?v=b1d3bb04"></script>
<script src="shared/physics.js?v=ce40dcd2"></script>
<script src="shared/wombat.js?v=4b3f92f6"></script>
<script>
(() => {
  const { W, H, GRAV, rand, clamp } = WB;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const disp = WB.fitDisplay(cv, document.getElementById('wrap'));
  let t = 0;
  const { roundRect, drawButton, drawRoundButton, drawPoop, drawStack, drawWombatArt, drawPlatform, drawTopPlat,
          drawLettuce, drawDiarrhea, drawParticles, drawGround, drawGoalLine } = WB.createArt(ctx, () => t);

  // ---------- Game state ----------
  const STATE = { MENU: 0, PLAY: 1, TOPPLE: 2, OVER: 3 };
  let state = STATE.MENU;
  let score = 0, best = 0, maxMiss = 3;

  // ---------- Personal high score (persisted across sessions) ----------
  const HS_KEY = 'wombatPoopHigh';
  let highScore = 0, highName = '';
  let entering = false;          // true while the name-entry overlay is open
  (function loadHigh(){
    try {
      const d = JSON.parse(localStorage.getItem(HS_KEY) || 'null');
      if(d){ highScore = d.score|0; highName = d.name || ''; best = highScore; }
    } catch(e){}
  })();
  function saveHigh(){
    try { localStorage.setItem(HS_KEY, JSON.stringify({ name: highName, score: highScore })); }
    catch(e){}
  }
  let toppleTimer = 0;
  let danger = 0;   // 0 = rock solid, 1 = about to topple (wobble meter)
  // camera / climbing mechanic
  let camTarget = 0;                      // camera eases S.camOffset toward this
  let level = 1, raising = false;
  let jumpTimer = 0, raiseDelay = 0;      // level-up: wombat leaps, then the camera follows
  const goalScreenY = Math.round(H/3);   // red goal line ~2/3 of the way up
  const RAISE_BAND = 180;                 // how much of the pile stays visible after a raise

  // Endless mode's pile physics. The campaign is tuned softer (see its TUNE).
  const TUNE = {
    fallMul: 1, maxFallV: Infinity,       // no terminal velocity
    measureTip: true,                     // poops near the edge of their support make the pile nervous
    swayPush: 0.004, nervous: 0.02,
    restoreMax: 0.06, restoreInstab: 0.012, restoreMin: 0.02,
    damping: 0.93
  };
  // First-ever game: point out the catch platform until the first catch.
  const TUTORIAL_KEY = 'wombatTutorialDone';
  let tutorial = true;
  try { tutorial = localStorage.getItem(TUTORIAL_KEY) !== '1'; } catch(e){}
  function tutorialDone(){
    if(!tutorial) return;
    tutorial = false;
    try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch(e){}
  }

  const hooks = {
    onSettle: p => { score += Math.max(1, Math.round(p.w/12)); tutorialDone(); },
    onMiss: () => { if(S.misses >= maxMiss) endGame(); },
    // poops come quicker as the score climbs
    nextPoopAt: t => t + clamp(150 - score*0.6, 70, 150) + rand(-25, 55),
    hop: topHop
  };
  let S;                                  // the current run (see shared/physics.js)
  let shakeX = 0, shakeY = 0;             // this step's screen-shake offset

  // ---------- Input ----------
  const input = { keys: {}, pointerX: null };
  window.addEventListener('keydown', e => {
    if (entering) return;                       // typing a high-score name — ignore game controls
    input.keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || ['arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
    if ((e.key.toLowerCase() === 'p' || e.key === 'Escape') && state === STATE.PLAY) paused = !paused;
    if (e.key.toLowerCase() === 'm') WB.sound.toggle();
    if ((state === STATE.MENU || state === STATE.OVER) && (e.key === ' ' || e.key === 'Enter')) start();
  });
  window.addEventListener('keyup', e => input.keys[e.key.toLowerCase()] = false);

  // on-screen buttons (logical canvas units)
  const PAUSE_BTN  = { x: W-38, y: 118, r: 22 };                  // during play, top right
  const BTN_RESUME = { x: W/2-150, y: H*0.40,    w: 300, h: 62 }; // pause screen
  const BTN_QUIT   = { x: W/2-150, y: H*0.40+80, w: 300, h: 62 };
  const BTN_SOUND  = { x: W/2-150, y: H*0.40+160, w: 300, h: 62 };
  const BTN_MENU   = { x: 18, y: 18, w: 136, h: 48 };              // title + game-over screens
  const SOUND_BTN  = PAUSE_BTN;                                     // title + game-over screens

  function onDown(x, y){
    if(entering) return;
    if(state === STATE.PLAY){
      if(paused){
        if(WB.hitBtn(BTN_RESUME, x, y)){ paused = false; WB.sfx('click'); }
        else if(WB.hitBtn(BTN_QUIT, x, y)) WB.toMenu();
        else if(WB.hitBtn(BTN_SOUND, x, y)) WB.sound.toggle();
        return;
      }
      if(WB.hitRound(PAUSE_BTN, x, y)){ paused = true; WB.sfx('click'); return; }
      input.pointerX = x;
      return;
    }
    input.pointerX = x;
    const onMenuScreen = state === STATE.MENU || state === STATE.OVER;
    if(onMenuScreen && WB.hitRound(SOUND_BTN, x, y)) WB.sound.toggle();
    else if(onMenuScreen && WB.hitBtn(BTN_MENU, x, y)) WB.toMenu();
    else start();
  }
  const canvasX = clientX => WB.canvasPt(cv, clientX, 0).x;
  cv.addEventListener('mousemove', e => input.pointerX = canvasX(e.clientX));
  cv.addEventListener('mousedown', e => { const p = WB.canvasPt(cv, e.clientX, e.clientY); onDown(p.x, p.y); });
  cv.addEventListener('touchstart', e => { const p = WB.canvasPt(cv, e.touches[0].clientX, e.touches[0].clientY); onDown(p.x, p.y); e.preventDefault(); }, {passive:false});
  cv.addEventListener('touchmove', e => { input.pointerX = canvasX(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  cv.addEventListener('mouseleave', () => input.pointerX = null);

  let paused = false;
  const hintEl = document.getElementById('hint');
  hintEl.innerHTML = WB.isTouch
    ? 'Drag to move &nbsp;·&nbsp; ⏸ to pause &nbsp;·&nbsp; catch the plops, don\'t let the tower topple!'
    : '← → / A D / mouse to move &nbsp;·&nbsp; P to pause &nbsp;·&nbsp; M to mute &nbsp;·&nbsp; catch the plops, don\'t let the tower topple!';
  // switching away mid-game pauses it, so nothing falls while nobody's looking
  WB.onAway(() => { if(state === STATE.PLAY) paused = true; });

  function reset(){
    score = 0; toppleTimer = 0;
    S = WB.newRun(t, { platW: 150, tune: TUNE, hooks });
    paused = false; danger = 0;
    camTarget = 0; level = 1; raising = false;
    jumpTimer = 0; raiseDelay = 0;
  }
  function start(){ hideSaveOverlay(); reset(); state = STATE.PLAY; }

  // ---------- Game over + high-score entry ----------
  const saveOverlay = document.getElementById('saveOverlay');
  const nameEntry   = document.getElementById('nameEntry');
  const saveSub     = document.getElementById('saveSub');

  function endGame(){
    if(state !== STATE.OVER) WB.sfx(score > highScore ? 'win' : 'sad');
    state = STATE.OVER;
    best = Math.max(best, score);
    if(score > highScore){
      // new personal best — let the player put their name to it
      entering = true;
      saveSub.textContent = 'Score ' + score + (highScore ? ' · beat ' + highScore : '');
      nameEntry.value = highName;
      saveOverlay.style.display = 'flex';
      setTimeout(() => { nameEntry.focus(); nameEntry.select(); }, 0);
    }
  }
  function hideSaveOverlay(){ entering = false; saveOverlay.style.display = 'none'; }
  function commitHigh(){
    highName = (nameEntry.value.trim() || 'Wombat').slice(0, 12);
    highScore = score;
    best = Math.max(best, highScore);
    saveHigh();
    hideSaveOverlay();
  }
  document.getElementById('saveBtn').addEventListener('click', commitHigh);
  document.getElementById('skipBtn').addEventListener('click', hideSaveOverlay);
  nameEntry.addEventListener('keydown', e => {
    e.stopPropagation();                       // don't let the game see these keys
    if(e.key === 'Enter') commitHigh();
    else if(e.key === 'Escape') hideSaveOverlay();
  });

  // ---------- Toppling ----------
  function beginTopple(dir){
    state = STATE.TOPPLE;
    toppleTimer = 0;
    for(const c of S.stack){
      c.x = S.plat.x + c.off;         // freeze current world x, then fall straight
      c.vx = rand(-0.5, 0.5);         // tiny symmetric scatter, never a sideways launch
      c.vfall = rand(0, 1.2);
      c.spin = rand(-0.14, 0.14);
    }
    // the poop still in the air keeps tumbling down too
    for(const p of S.plops){
      p.vx = rand(-0.5, 0.5);
      p.vy = Math.max(p.vy||0, 0.5);
      p.vr = (p.vr||0) + rand(-0.14, 0.14);
    }
    S.shake = 16;
    WB.sfx('topple');
  }

  function updateTopple(){
    toppleTimer++;
    danger = 1;
    let allGone = true;   // everything has fallen past the bottom of the screen
    for(const c of S.stack){
      c.vfall = (c.vfall||0) + 0.55;
      c.y += c.vfall; c.x += (c.vx||0);
      c.rot = (c.rot||0) + (c.spin||0);
      if(c.y + S.camOffset - c.h/2 <= H) allGone = false;
    }
    for(const p of S.plops){
      p.vy = (p.vy||0) + GRAV*3;
      p.y += p.vy; p.x += (p.vx||0);
      p.rot += (p.vr||0);
      if(p.y + S.camOffset - p.h/2 <= H) allGone = false;
    }
    if(toppleTimer > 240 || allGone){
      endGame();
    }
  }

  // ---------- Lettuce from the sky ----------
  function updateHazards(){
    // maybe drop a lettuce for the wombat (not while it's already busy)
    if(!S.lettuce && S.diarrheaTimer<=0 && S.wombat.mode==='crawl' && Math.random() < 0.0016){
      const b = WB.topPlat.w/2 - 70;
      S.lettuce = { x: W/2 + rand(-b, b), y: -30, vy: 0, landed: false, wob: 0, eatScale: 1 };
    }
    WB.updateLettuceAndDiarrhea(S, t);
  }

  // ---------- Update ----------
  function update(){
    t++;
    if(S.shake > 0) S.shake *= 0.85;
    if(S.comboFlash>0) S.comboFlash--;

    if(state === STATE.PLAY && !paused){
      WB.steerPlatform(S, input);
      WB.updateWombat(S, t);
      updateHazards();
      WB.stepPlops(S);

      const effOff = WB.updateStack(S, t);
      if(effOff === null) danger += (0 - danger) * 0.2;
      else {
        const edge = S.plat.w/2 + 22;                    // topple once it clears the platform edge
        danger += (clamp(Math.abs(effOff)/edge, 0, 1) - danger) * 0.2;
        if(danger > 0.8) WB.sfx('creak');                // the tower groans before it goes
        if(Math.abs(effOff) > edge) beginTopple(effOff > 0 ? 1 : -1);
      }

      // climbing: when the stack top reaches the red goal line, raise the
      // view so only the top 3 poops remain, and keep climbing to a new line
      if(!raising && S.stack.length){
        const stackTopScreen = WB.stackTopWorldY(S) + S.camOffset;
        if(stackTopScreen <= goalScreenY){
          raising = true; level++;
          WB.sfx('levelup');
          S.raiseBaseY = WB.stackTopWorldY(S);           // reset the wobble reference for the new level
          camTarget = (H - RAISE_BAND) - WB.stackTopWorldY(S);
          jumpTimer = 32; raiseDelay = 16;               // wombat leaps up, THEN the camera follows
        }
      }
      if(jumpTimer > 0) jumpTimer--;
      if(raiseDelay > 0) raiseDelay--;
      else S.camOffset += (camTarget - S.camOffset) * 0.04;  // camera pans up to meet the wombat
      if(raising && Math.abs(camTarget - S.camOffset) < 1.0) raising = false;
    }

    if(state === STATE.TOPPLE) updateTopple();

    WB.updateParticles(S.particles);

    // rolled here rather than in render(), which can run more than once a step
    shakeX = (Math.random()-0.5)*S.shake; shakeY = (Math.random()-0.5)*S.shake;
  }

  // ---------- Drawing ----------
  // upward offset for the wombat + its platform during a level-up leap
  function topHop(){
    let h = 0;
    if(jumpTimer > 0) h += Math.sin((1 - jumpTimer/32)*Math.PI) * 46;          // the leap arc
    if(raising && camTarget) h += clamp(1 - S.camOffset/camTarget, 0, 1) * 60;   // stay lifted until the camera catches up
    return h;
  }

  function drawClouds(){
    ctx.fillStyle='rgba(255,255,255,.75)';
    for(let i=0;i<3;i++){
      const cx = ((t*0.3 + i*260) % (W+200)) - 100;
      const cy = 60 + i*40;
      cloud(cx,cy, 34+i*6);
    }
  }
  function cloud(x,y,r){
    ctx.beginPath();
    ctx.arc(x,y,r,0,7); ctx.arc(x+r,y+6,r*0.8,0,7);
    ctx.arc(x-r,y+8,r*0.7,0,7); ctx.arc(x+r*0.4,y-r*0.6,r*0.7,0,7);
    ctx.fill();
  }

  function drawHUD(){
    ctx.save();
    ctx.textAlign='left';
    ctx.fillStyle='#2d5016';
    ctx.font='bold 40px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillText('💩 ' + score, 22, 52);
    // misses
    ctx.textAlign='right';
    ctx.font='30px "Comic Neue", "Comic Sans MS", cursive';
    let hearts='';
    for(let i=0;i<maxMiss;i++) hearts += i<maxMiss-S.misses ? '🧻' : '❌';
    ctx.fillText(hearts, W-22, 48);
    ctx.textAlign='left';
    ctx.font='20px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillStyle='#3a6b1f';
    ctx.fillText('height: ' + S.stack.length, 22, 82);
    // level (climbs each time you reach the goal line)
    ctx.textAlign='right';
    ctx.font='bold 22px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillStyle='#2d5016';
    ctx.fillText('🏔 Lv ' + level, W-22, 80);
    ctx.textAlign='left';
    ctx.restore();
    if(state === STATE.PLAY || state === STATE.TOPPLE) drawWobbleMeter();
  }

  function drawWobbleMeter(){
    const x = 22, y = 106, w = 200, h = 20;
    const d = clamp(danger, 0, 1);
    const shiver = d > 0.55 ? Math.sin(t*0.7) * d * 2.5 : 0;
    ctx.save();
    // label
    ctx.textAlign='left';
    ctx.font='bold 13px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillStyle='#2d5016';
    ctx.fillText('🌀 WOBBLE-O-METER', x, y - 5);
    // track
    ctx.fillStyle='rgba(255,255,255,.6)';
    roundRect(x, y, w, h, h/2); ctx.fill();
    ctx.strokeStyle='#2d5016'; ctx.lineWidth=2; roundRect(x, y, w, h, h/2); ctx.stroke();
    // fill (green → yellow → red), shivering when high
    const fw = Math.max(h, d * w);
    const hue = (1 - d) * 115;
    ctx.save();
    roundRect(x, y, w, h, h/2); ctx.clip();
    ctx.fillStyle = `hsl(${hue}, 82%, 47%)`;
    roundRect(x + shiver, y, fw, h, h/2); ctx.fill();
    // little tick marks
    ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=1;
    for(let i=1;i<5;i++){ ctx.beginPath(); ctx.moveTo(x+w*i/5,y); ctx.lineTo(x+w*i/5,y+h); ctx.stroke(); }
    ctx.restore();
    // face indicator that rides the bar
    const face = d < 0.5 ? '🙂' : d < 0.8 ? '😬' : '😱';
    ctx.font = '18px serif';
    ctx.textAlign='center';
    ctx.fillText(face, clamp(x + fw, x + 12, x + w - 4), y + h/2 + 6 + shiver);
    // danger warning
    if(d > 0.8 && Math.sin(t*0.4) > 0){
      ctx.textAlign='left';
      ctx.font='bold 15px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillStyle='#e11d1d';
      ctx.fillText('⚠ TIPPY!!', x + w + 10, y + h - 3);
    }
    ctx.restore();
  }

  // first game only: show where to catch, riding along with the platform
  function drawTutorial(){
    const bob = Math.sin(t*0.12) * 4;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px "Comic Neue", "Comic Sans MS", cursive';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.fillStyle = '#7a3d12';
    const msg = WB.isTouch ? '⬅ drag to catch the poop! ➡' : '⬅ move to catch the poop! ➡';
    const x = clamp(S.plat.x, 190, W - 190), y = S.plat.y - 52 + bob;
    ctx.strokeText(msg, x, y); ctx.fillText(msg, x, y);
    ctx.restore();
  }

  function centerText(lines){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    let y = H*0.32;
    for(const l of lines){
      ctx.font = l.font;
      ctx.fillStyle = l.color || '#fff';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,.5)';
      if(l.stroke) ctx.strokeText(l.text, W/2, y);
      ctx.fillText(l.text, W/2, y);
      y += l.gap || 60;
    }
    ctx.restore();
  }

  function render(){
    // Re-assert the DPR transform every frame: resizing the canvas wipes context
    // state, and this makes the base transform immune to any save/restore drift.
    ctx.setTransform(disp.sx, 0, 0, disp.sy, 0, 0);
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawClouds();

    // the ground, tower, catch platform and falling poops scroll with the
    // camera — so climbing reads as the view rising, not the platform dropping
    ctx.save();
    ctx.translate(0, S.camOffset);
    drawGround(S.plat);
    drawPlatform(S.plat);
    drawStack(S, state !== STATE.TOPPLE && state !== STATE.OVER);
    // don't draw mid-air poops once the game is over (they'd hang frozen)
    if(state !== STATE.OVER) for(const p of S.plops) drawPoop(p.x,p.y,p.w,p.h,p.rot,p.squish,p.hue);
    if(state === STATE.PLAY && tutorial) drawTutorial();
    ctx.restore();
    drawDiarrhea(S.diarrhea, S.camOffset);   // hot drops falling onto the tower
    // the wombat stays at the top of the screen as the poop source
    const hop = topHop();
    drawTopPlat(hop);
    drawLettuce(S.lettuce, hop);
    drawWombatArt(S.wombat, 1, WB.PAL_PLAYER, { lift: hop });
    drawParticles(S.particles);
    if(state === STATE.PLAY || state === STATE.TOPPLE) drawGoalLine(goalScreenY);
    drawHUD();

    ctx.restore();

    if(state === STATE.PLAY && !paused) drawRoundButton(PAUSE_BTN, 'pause');
    if(state === STATE.MENU || state === STATE.OVER) drawRoundButton(SOUND_BTN, WB.sound.muted() ? 'muted' : 'sound');

    if(state === STATE.MENU){
      centerText([
        {text:'💩 COMBAT WOMBAT 💩', font:'bold 52px "Comic Neue", "Comic Sans MS", cursive', color:'#fff', stroke:true, gap:56},
        {text:'POOP STACKER', font:'bold 40px "Comic Neue", "Comic Sans MS", cursive', color:'#ffe14d', stroke:true, gap:80},
        {text:'Catch the plops. Stack \'em high.', font:'24px "Comic Neue", "Comic Sans MS", cursive', gap:38},
        {text:'Don\'t let the tower topple!', font:'24px "Comic Neue", "Comic Sans MS", cursive', gap:80},
        {text:'▶ Click / Tap / Space to start', font:'bold 28px "Comic Neue", "Comic Sans MS", cursive', color:'#7bed9f', stroke:true},
      ]);
      drawButton(BTN_MENU, '◂ Menu', '#fff8e7', '#7a3d12', 22);
    }
    if(state === STATE.OVER){
      centerText([
        {text: S.misses>=maxMiss ? '🧻 Out of toilet paper!' : '🗼 TIMBERRR!', font:'bold 46px "Comic Neue", "Comic Sans MS", cursive', color:'#fff', stroke:true, gap:70},
        {text:'Score: ' + score, font:'bold 40px "Comic Neue", "Comic Sans MS", cursive', color:'#ffe14d', stroke:true, gap:46},
        {text:'Best: ' + Math.max(best,highScore) + (highName ? ' (' + highName + ')' : ''), font:'26px "Comic Neue", "Comic Sans MS", cursive', gap:36},
        {text:'Reached level ' + level + ' · ' + S.stack.length + ' plops', font:'22px "Comic Neue", "Comic Sans MS", cursive', gap:80},
        {text:'▶ Click / Space to poop again', font:'bold 26px "Comic Neue", "Comic Sans MS", cursive', color:'#7bed9f', stroke:true},
      ]);
      drawButton(BTN_MENU, '◂ Menu', '#fff8e7', '#7a3d12', 22);
    }
    if(paused && state===STATE.PLAY){
      centerText([{text:'⏸ Paused', font:'bold 48px "Comic Neue", "Comic Sans MS", cursive', color:'#fff', stroke:true}]);
      drawButton(BTN_RESUME, '▶ Resume', '#7bed9f', '#14532d');
      drawButton(BTN_QUIT,   '🏠 Main menu', '#fff8e7', '#7a3d12');
      drawButton(BTN_SOUND,  WB.sound.muted() ? '🔇 Sound: off' : '🔊 Sound: on', '#fff8e7', '#7a3d12');
    }

    // the cursor only hides while you're steering the platform with it
    const playing = state === STATE.PLAY && !paused;
    const cursor = playing ? 'none' : 'default';
    if(cv.style.cursor !== cursor) cv.style.cursor = cursor;
    // the controls hint sits over the bottom of the game, so it hides during play
    const hintVis = playing ? 'hidden' : 'visible';
    if(hintEl.style.visibility !== hintVis) hintEl.style.visibility = hintVis;
  }

  reset();                                // a run to show behind the title screen
  WB.runLoop(update, render);
})();
</script>
</body>
</html>

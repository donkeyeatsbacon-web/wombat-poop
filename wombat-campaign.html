<script>
(() => {
  const { W, H, topPlat, rand, clamp } = WB;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const disp = WB.fitDisplay(cv, document.getElementById('wrap'));
  let t = 0;
  const { roundRect, drawButton, drawRoundButton, drawGumNut, drawPoop, drawStack, drawWombatArt, drawPlatform, drawTopPlat,
          drawLettuce, drawDiarrhea, drawParticles, drawGround, drawGoalLine, drawTrail, drawStickerToast } = WB.createArt(ctx, () => t);
  const { PAL_PLAYER, PAL_RIVAL, PAL_MATE } = WB;

  // =====================================================================
  //  CAMPAIGN STATE
  // =====================================================================
  const MODE = { INTRO:0, OVERWORLD:1, TRAVEL:2, LEVEL:3, WIN:4, LOSE:5 };
  let mode = MODE.INTRO;

  const THREAT_MAX = 100;
  // Each season needs more charm than the last: 100, 130, 160, ...
  const charmGoal = (season) => 100 + 30*((season || player.season) - 1);
  // household: mates you've wooed, who live in your burrow ({ name, kind });
  // party: the names you last took along to a level
  const player = { season: 1, charm: 0, threat: 0, day: 1, buffs: [], debuffs: [], household: [], party: [] };

  const BUFFS = [
    { key:'wide',  icon:'🧡', name:'Charmer',     desc:'Wider catch platform' },
    { key:'slow',  icon:'🐌', name:'Slowpoke',    desc:'Plops fall slower' },
    { key:'tp',    icon:'🧻', name:'Stocked Up',  desc:'+1 toilet paper' },
    { key:'steady',icon:'🎯', name:'Steady Paws', desc:'Tower topples less easily' },
  ];
  const DEBUFFS = [
    { key:'narrow',icon:'🦶', name:'Trampled', desc:'Narrower catch platform' },
    { key:'fast',  icon:'⚡', name:'Rattled',  desc:'Plops fall faster' },
    { key:'lesstp',icon:'💔', name:'Shaken',   desc:'-1 toilet paper' },
    { key:'dizzy', icon:'🌀', name:'Dizzy',    desc:'Tower topples more easily' },
  ];

  function effectiveParams(baseTarget){
    let platW = 150, fallMul = 1, maxMiss = 3, margin = 30;
    const has = (a,k)=>a.includes(k);
    if(has(player.buffs,'wide'))    platW += 40;
    if(has(player.debuffs,'narrow'))platW -= 40;
    if(has(player.buffs,'slow'))    fallMul *= 0.7;
    if(has(player.debuffs,'fast'))  fallMul *= 1.4;
    if(has(player.buffs,'tp'))      maxMiss += 1;
    if(has(player.debuffs,'lesstp'))maxMiss -= 1;
    if(has(player.buffs,'steady'))  margin += 22;
    if(has(player.debuffs,'dizzy')) margin -= 18;
    return { platW: clamp(platW,70,240), fallMul: clamp(fallMul,0.5,2),
             maxMiss: clamp(maxMiss,1,6), margin: clamp(margin,8,70), target: baseTarget };
  }

  // =====================================================================
  //  OVERWORLD
  // =====================================================================
  let nodes = [], homeNode = null, wave = 0, encounters = 0;
  let womb = { x:W/2, y:H*0.52+30, dir:1, bob:0 };
  let travel = null, toast = null;

  // The first four of each greet a new season; newcomers draw from the rest.
  const MATE_NAMES  = ['Wanda','Winnie','Wendy','Willa','Matilda','Bindi','Pearl','Daisy','Tilly','Mabel','Rosie','Hazel'];
  // A name no mate on the map or in your burrow has yet (your burrow carries
  // over between seasons). Once every name is used, daughters take them: "Wanda II".
  function freshMateName(taken){
    for(let gen = 1; ; gen++){
      const suffix = gen===1 ? '' : ' '+['','','II','III','IV','V','VI','VII','VIII','IX','X'][Math.min(gen,10)];
      const pool = MATE_NAMES.map(nm => nm+suffix).filter(nm => !taken.has(nm));
      if(pool.length) return pool[(Math.random()*pool.length)|0];
    }
  }
  // Prefer a personality your burrow hasn't got yet.
  function freshMateKind(){
    const kinds = Object.keys(MATE_KINDS), have = new Set(player.household.map(m => m.kind));
    const fresh = kinds.filter(k => !have.has(k));
    const pool = fresh.length ? fresh : kinds;
    return pool[(Math.random()*pool.length)|0];
  }
  const RIVAL_NAMES = ['Bruiser','Chomps','Tank','Grunt','Digger','Boof','Crusher','Stomper','Gnasher','Bazza','Thumper','Knuckles'];
  const INVADE_R = 152;

  // ---------- Rival personalities ----------
  // Every rival has one, shown on its map marker. Early in a season they're
  // mild; nastier ones move in as the season goes on (rivalPool).
  // every: frames between attempts [min, max].
  const RIVAL_KINDS = {
    roller:  { icon:'🥬', name:'Roller',  every:[360, 620], desc:'rolls lettuce at your wombat' },
    lobber:  { icon:'🎯', name:'Lobber',  every:[420, 660], desc:'lobs lettuce: catch it to send them packing' },
    rotter:  { icon:'🤢', name:'Rotter',  every:[420, 700], desc:'rolls rotten lettuce, quick and nasty' },
    bully:   { icon:'💪', name:'Bully',   every:[480, 720], desc:'shoves your wombat along the plank' },
    stomper: { icon:'💥', name:'Stomper', every:[420, 660], desc:'stomps the plank and rattles your tower' },
    thief:   { icon:'🖐', name:'Thief',   every:[600, 840], desc:'steals the top poop off your stack' },
    plopper: { icon:'💩', name:'Plopper', every:[360, 600], desc:'drops bad poops that rot your stack' },
  };
  const rivalPool = () => wave < 1 ? ['roller','lobber']
                        : wave < 2 ? ['roller','lobber','rotter','bully']
                        : Object.keys(RIVAL_KINDS);
  const kindOf = n => RIVAL_KINDS[n.kind] ? n.kind : 'roller';

  // ---------- Mate personalities ----------
  // Every mate has one, shown on her marker. Woo her and she moves into your
  // burrow; take her along to a level (see the party picker) for her perk.
  // The Sage's perk works from the burrow, so she doesn't need a seat.
  const MATE_KINDS = {
    gardener:{ icon:'🌿', name:'Gardener', desc:'eats the first lettuce of each level before your wombat can' },
    builder: { icon:'🔨', name:'Builder',  desc:'your platform is 20 px wider' },
    lookout: { icon:'👀', name:'Lookout',  desc:'a shadow shows where the next poop will land' },
    steady:  { icon:'🧘', name:'Steady',   desc:'the tower\'s wobble dies down faster' },
    charmer: { icon:'💝', name:'Charmer',  desc:'+25% Gum Nuts from levels' },
    bouncer: { icon:'🛡', name:'Bouncer',  desc:'shoos one rival off your plank at the start of each level' },
    digger:  { icon:'⛏', name:'Digger',   desc:'the first poop you miss each level costs no toilet paper' },
    forager: { icon:'🍄', name:'Forager',  desc:'+1 Gum Nut for every 5 poops stacked' },
    nurse:   { icon:'🩹', name:'Nurse',    desc:'+1 toilet paper' },
    sage:    { icon:'🦉', name:'Sage',     desc:'shows how many days until each rival reaches you (from the burrow)' },
    drummer: { icon:'🥁', name:'Drummer',  desc:'a drum beat counts in each poop' },
    acrobat: { icon:'🤸', name:'Acrobat',  desc:'flicks back one poop per stack that slides off the edge' },
  };
  const mateKindOf = n => MATE_KINDS[n.kind] ? n.kind : 'gardener';
  const inBurrow = kind => player.household.some(m => m.kind === kind);   // invading rivals stop on a ring this far from the burrow, each on its own trail

  // Lay out a fresh territory for this season. Every season after the first
  // starts tougher: faster rivals, bigger stacks, nastier personalities sooner.
  function buildMap(){
    const sx = player.season - 1;
    nodes = []; wave = sx; encounters = 0;
    homeNode = { x:W/2, y:H*0.52, type:'home', name:'Burrow', state:'open' };
    nodes.push(homeNode);
    const cx = homeNode.x, cy = homeNode.y, rx = 216, ry = 250;
    const spots = [
      { x:cx,      y:cy-ry,     type:'mate'  },
      { x:cx+rx,   y:cy-ry*0.5, type:'rival' },
      { x:cx+rx,   y:cy+ry*0.5, type:'mate'  },
      { x:cx,      y:cy+ry,     type:'rival' },
      { x:cx-rx,   y:cy+ry*0.5, type:'mate'  },
      { x:cx-rx,   y:cy-ry*0.5, type:'rival' },
    ];
    let mi=0, ri=0;
    for(const s of spots){
      // the point a mate heads for as she leaves the territory. Every spot
      // gets one, since a rival's spot can later be taken by a mate.
      const ax = cx + (s.x-cx)*1.5, ay = cy + (s.y-cy)*1.5;
      if(s.type==='mate'){
        // mates wander off on their own schedule — woo them before they go
        nodes.push({ homeX:s.x, homeY:s.y, awayX:ax, awayY:ay, x:s.x, y:s.y, type:'mate',
          ...(player.household.length
                ? (() => { const name = freshMateName(new Set([...nodes.map(m => m.name), ...player.household.map(m => m.name)]));
                           return { name, kind: freshMateKind() }; })()
                : { name: MATE_NAMES[mi%MATE_NAMES.length], kind: ['gardener','builder','lookout'][mi%3] }),
          target:4 + Math.floor(sx/2), stacks:2 + Math.floor(sx/2), state:'open',
          march:0, speed:[0.20,0.16,0.26][mi%3] + sx*0.015, delay:[1,3,0][mi%3] });
        mi++;
      } else {
        // rivals march inward on their own schedule — staggered starts & speeds
        nodes.push({ homeX:s.x, homeY:s.y, awayX:ax, awayY:ay, x:s.x, y:s.y, type:'rival',
          name:RIVAL_NAMES[ri%RIVAL_NAMES.length],
          kind: sx ? rivalPool()[(Math.random()*rivalPool().length)|0] : ['roller','lobber','roller'][ri%3],
          target:5 + Math.floor(sx/2), stacks:3 + Math.floor(sx/2), state:'open',
          march:0, speed:[0.34,0.26,0.20][ri%3] + sx*0.025, delay:[0,1,3][ri%3], invader:false });
        ri++;
      }
    }
    womb.x = homeNode.x; womb.y = homeNode.y + 30;
  }

  // where a node currently stands: rivals close in on the burrow (stopping on
  // a ring around it, so invaders don't pile up on one spot), mates drift away
  function nodePos(n){
    let tx = n.awayX, ty = n.awayY;
    if(n.type==='rival'){
      const dx = n.homeX - homeNode.x, dy = n.homeY - homeNode.y, d = Math.hypot(dx, dy) || 1;
      tx = homeNode.x + dx/d*INVADE_R; ty = homeNode.y + dy/d*INVADE_R;
    }
    return { x: n.homeX + (tx - n.homeX)*n.march, y: n.homeY + (ty - n.homeY)*n.march };
  }
  function invaders(){ return nodes.filter(n=>n.type==='rival' && n.invader); }

  function advanceDay(){
    player.day++;
    const arrived = [], departed = [];
    for(const n of nodes){
      if(n.type==='home') continue;
      if(n.delay > 0){ n.delay--; continue; }        // staggered — not on the move yet
      if(n.march < 1){
        n.march = clamp(n.march + n.speed, 0, 1);
        const p = nodePos(n); n.x = p.x; n.y = p.y;
        if(n.march >= 1){
          if(n.type==='rival' && !n.invader){ n.invader = true; arrived.push(n.name); }
          else if(n.type==='mate'){
            departed.push(n.name);
            respawnNode(n);                          // she's gone; someone new moves in
          }
        }
      }
      if(n.type==='rival') player.threat = clamp(player.threat + (n.invader ? 10 : 5), 0, THREAT_MAX);
    }
    if(arrived.length) showToast('⚠ '+arrived.join(' & ')+' reached your territory! They\'ll roll lettuce at you.');
    else if(departed.length) showToast('💔 '+departed.join(' & ')+' wandered off — you were too slow.');
    if(player.threat >= THREAT_MAX) mode = MODE.LOSE;
    else if(player.charm >= charmGoal()) mode = MODE.WIN;
  }

  function showToast(text){ toast = { text, life:190 }; }

  // A settled spot doesn't stay empty — another wombat moves in.
  // 60% of newcomers are males (rivals), 40% females (mates).
  function respawnNode(n){
    encounters++;
    wave = Math.floor(encounters/6) + (player.season - 1);   // tougher as the season goes on, and each season
    const outgoing = n.name;
    n.type    = Math.random() < 0.6 ? 'rival' : 'mate';
    const taken = new Set(nodes.map(m => m.name));          // includes the outgoing wombat
    if(n.type==='mate'){
      for(const m of player.household) taken.add(m.name);   // never a second "Wanda"
      n.name = freshMateName(taken);
    } else {
      let pool = RIVAL_NAMES.filter(nm => !taken.has(nm));
      if(!pool.length) pool = RIVAL_NAMES.filter(nm => nm !== outgoing);
      n.name = pool[(Math.random()*pool.length)|0];   // clearly a different wombat
    }
    n.target  = (n.type==='mate'?4:5) + Math.floor(wave/2);
    n.stacks  = (n.type==='mate'?2:3) + Math.floor(wave/2);
    n.state   = 'open';
    n.march   = 0; n.invader = false;
    n.x = n.homeX; n.y = n.homeY;
    if(n.type==='rival'){
      const pool = rivalPool();
      n.kind  = pool[(Math.random()*pool.length)|0];
      n.delay = 1 + ((Math.random()*3)|0);        // staggered arrival
      n.speed = [0.34,0.26,0.20][(Math.random()*3)|0] + wave*0.03;   // (wave includes the season)
    } else {
      n.kind  = freshMateKind();
      n.delay = 1 + ((Math.random()*3)|0);
      n.speed = [0.20,0.16,0.26][(Math.random()*3)|0] + wave*0.02;
    }
    return n;
  }

  // =====================================================================
  //  SAVE / LOAD
  // =====================================================================
  // Progress is snapshotted at overworld granularity — after each day resolves,
  // never mid-level. Quitting inside a level drops you back to the start of that
  // day, which does let you retry a level you were losing. That's a deliberate
  // trade: an app kill isn't the player's fault, and punishing it is worse than
  // the occasional retry.
  //
  // Packaging note: to move this onto Capacitor Preferences, replace loadRaw /
  // saveRaw / clearRaw and nothing else. They are the only storage touchpoints.
  const SAVE_KEY = 'wombatCampaignSave';
  const SAVE_VERSION = 1;

  function loadRaw(){ try { return localStorage.getItem(SAVE_KEY); } catch(e){ return null; } }
  function saveRaw(s){ try { localStorage.setItem(SAVE_KEY, s); } catch(e){} }
  function clearRaw(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

  function snapshot(){
    return {
      v: SAVE_VERSION,
      player: { season:player.season, charm:player.charm, threat:player.threat, day:player.day,
                buffs:player.buffs.slice(), debuffs:player.debuffs.slice(),
                household:player.household.map(m=>({ name:m.name, kind:m.kind })), party:player.party.slice() },
      wave, encounters,
      nodes: nodes.map(n=>({ homeX:n.homeX, homeY:n.homeY, awayX:n.awayX, awayY:n.awayY,
        x:n.x, y:n.y, type:n.type, name:n.name, target:n.target, stacks:n.stacks,
        state:n.state, march:n.march, speed:n.speed, delay:n.delay, invader:n.invader, kind:n.kind }))
    };
  }

  function saveGame(){
    if(mode !== MODE.OVERWORLD) return;   // only the overworld is a coherent resume point
    try { saveRaw(JSON.stringify(snapshot())); } catch(e){}
  }

  // A save that survived a version bump, a partial write, or hand-editing must
  // never take the game down — anything suspect is treated as "no save".
  function validSave(d){
    if(!d || d.v !== SAVE_VERSION) return false;
    const p = d.player;
    if(!p || !Array.isArray(d.nodes) || !d.nodes.length) return false;
    if(!Number.isFinite(p.charm) || !Number.isFinite(p.threat) || !Number.isFinite(p.day)) return false;
    if(!Array.isArray(p.buffs) || !Array.isArray(p.debuffs)) return false;
    if(!d.nodes.some(n => n && n.type === 'home')) return false;
    return d.nodes.every(n => n && typeof n.type === 'string'
      && Number.isFinite(n.x) && Number.isFinite(n.y));
  }

  function readSave(){
    const raw = loadRaw();
    if(!raw) return null;
    let d; try { d = JSON.parse(raw); } catch(e){ d = null; }
    if(!validSave(d)){ clearRaw(); return null; }   // unreadable slot: drop it rather than retry forever
    return d;
  }

  const BUFF_KEYS = BUFFS.map(b=>b.key), DEBUFF_KEYS = DEBUFFS.map(b=>b.key);

  // Read once at boot. Non-null means the intro doubles as a Continue/New menu.
  let pendingSave = readSave();

  function restoreGame(d){
    player.season  = Math.max(1, d.player.season|0);
    player.charm   = clamp(d.player.charm, 0, charmGoal());
    player.threat  = clamp(d.player.threat, 0, THREAT_MAX);
    player.day     = Math.max(1, d.player.day|0);
    player.buffs   = d.player.buffs.filter(k=>BUFF_KEYS.includes(k));
    player.debuffs = d.player.debuffs.filter(k=>DEBUFF_KEYS.includes(k));
    player.household = (Array.isArray(d.player.household) ? d.player.household : [])
      .filter(m => m && typeof m.name === 'string' && MATE_KINDS[m.kind]).map(m => ({ name:m.name, kind:m.kind }));
    player.party = (Array.isArray(d.player.party) ? d.player.party : []).filter(nm => typeof nm === 'string');
    wave       = Number.isFinite(d.wave) ? d.wave : 0;
    encounters = Number.isFinite(d.encounters) ? d.encounters : 0;
    nodes      = d.nodes.map(n=>({ ...n, invader: !!n.invader }));
    homeNode   = nodes.find(n=>n.type==='home');
    // Saves from before the fixes: rival spots had no walk-away point, and
    // invaders all stood on the burrow. Fill in the one, re-place the other.
    for(const n of nodes){
      if(n.type==='home') continue;
      if(!Number.isFinite(n.awayX) || !Number.isFinite(n.awayY)){
        n.awayX = homeNode.x + (n.homeX - homeNode.x)*1.5; n.awayY = homeNode.y + (n.homeY - homeNode.y)*1.5;
      }
      if(n.march > 0){ const p = nodePos(n); n.x = p.x; n.y = p.y; }
      if(n.type==='rival') n.kind = kindOf(n);        // saves from before personalities
      if(n.type==='mate')  n.kind = mateKindOf(n);
    }
    womb.x = homeNode.x; womb.y = homeNode.y + 30;
    L = null; travel = null; toast = null;
    mode = MODE.OVERWORLD;
  }

  // A whole new campaign: season 1, an empty burrow.
  function newGame(){
    player.season = 1; player.household = []; player.party = [];
    startSeason();
  }
  // Start the current season afresh, keeping your burrow (and the season number).
  function startSeason(){
    WB.stickers.seasonFlag('seasonParty', 0);     // for Lone Wombat: no mate along yet this season
    player.charm = 0; player.threat = 0; player.day = 1;
    player.buffs = []; player.debuffs = [];
    L = null; travel = null; toast = null;
    buildMap();
    mode = MODE.OVERWORLD;
    saveGame();
  }

  // When a season ends, the save moves straight on: to the next season after a
  // win, or a retry of this one after a loss, with your burrow either way. The
  // banner shows how the season went (seasonEnd), over the new map.
  let seasonEnd = null;
  function endSeason(won){
    seasonEnd = { won, season: player.season, day: player.day, charm: player.charm, threat: player.threat };
    if(won){ WB.stickers.note('seasons'); if(!WB.stickers.flag('seasonParty')) WB.stickers.note('lone'); }
    if(won) player.season++;
    const shown = mode;
    startSeason();
    mode = shown;                                 // keep the banner up until a tap
  }

  // =====================================================================
  //  LEVEL  — the stacking itself lives in shared/ (same as endless mode)
  // =====================================================================
  let L = null;                // the current level's run (see shared/physics.js)
  let stickerShow = null;      // a sticker being announced: { s, t0 }
  let shakeX = 0, shakeY = 0;  // this step's screen-shake offset in a level

  // The campaign's pile physics: softer than endless mode, with a terminal
  // fall speed, and buffs/debuffs scale how fast plops fall.
  const TUNE = {
    fallMul: 1, maxFallV: 11,
    measureTip: false,
    // Calmed after playtest-2 by the same proportions as endless mode
    // (was 0.0017 / 0.03 / 0.058 / 0.016 / 0.94).
    swayPush: 0.00153, nervous: 0.021,
    restoreMax: 0.062, restoreInstab: 0.013, restoreMin: 0.019,
    damping: 0.93
  };
  // a mate's perk is on if she came along to this level
  const along = kind => L && L.party.find(m => m.kind === kind);

  const hooks = {
    onMiss: () => {
      const dig = along('digger');
      if(dig && L.pit > 0){ L.pit--; L.misses--; showToast('⛏ '+dig.name+'\'s pit caught it: no toilet paper lost'); return; }
      if(L.misses>=L.maxMiss && !L.result){ L.result='lose'; L.loseWhy='misses'; L.resultT=0; WB.sfx('sad'); }
    },
    // Gum Nuts: 1 per poop stacked, 5 more for a golden one
    onSettle: p => {
      if(p.bad){ L.stack[L.stack.length-1].rotT = 150; return; }   // a rival's bad cube: worth nothing, and it rots
      L.nuts += 1 + L.M.nutPerPoop; if(WB.isGolden(p.hue)){ L.nuts += 5; WB.stickers.note('golden'); }   // Big Eater: +1 each
      WB.stickers.note('poops');
      L.stacked++;
      if(L.M.rapidNuts && L.stacked % 2 === 0) L.nuts += 1;          // Rapid Fire: +1 every 2nd
      if(along('forager') && L.stacked % 5 === 0) L.nuts += 1;     // the Forager's find
    },
    onBoardDrop: () => { if(L.M.gutter) L.nuts += 1; },
    nextPoopAt: t => t + (WB.progress.pace(rand(70,150), 110, L.M)) * L.M.gapMul * L.M.campGapMul,
    onSnub: () => showToast('🙅 Your wombat turned its nose up at the lettuce')
  };

  function startLevel(node){
    const p = effectiveParams(node.target);
    const M = WB.progress.mods(true);          // the campaign always uses your Workshop upgrades
    // the mates who came along, sitting on the plank behind your wombat
    const party = player.party.map(nm => player.household.find(m => m.name === nm)).filter(Boolean)
      .slice(0, WB.progress.seats())
      .map((m, i) => ({ ...m, x: W/2 - 70*(i+1), crawl: i*1.7, wob: 0, face: 0, blink: 0 }));
    const has = k => party.some(m => m.kind === k);
    WB.stickers.best('party', party.length);
    if(party.length) WB.stickers.seasonFlag('seasonParty', 1);
    const tune = WB.progress.tune({ ...TUNE, fallMul:p.fallMul }, M);
    if(has('steady')) tune.damping -= 0.03;
    L = Object.assign(WB.newRun(t, { platW:p.platW + M.widthAdd + (has('builder') ? 20 : 0), tune, hooks,
                                     steerMul:M.steerMul, easeMul:M.easeMul }), {
      node, M, party,
      pit: has('digger') ? 1 : 0, stacked: 0, gardenerReady: has('gardener'), acroReady: has('acrobat'), beat: null,
      maxMiss:p.maxMiss + (has('nurse') ? 1 : 0), margin:p.margin + M.marginAdd, target:p.target,
      nuts:0, stackMaxRatio:0, anchorReady:true, slowmoReady:true, slowmoLeft:0, extendT:0,
      goalY:(H-70-13) - (p.target*42),
      stacksNeeded:node.stacks||1, stacksDone:0, banking:0, stars:[],
      result:null, resultT:0,
      // rival wombats that have reached the territory heckle you here
      // Invading rivals join you on the plank. Each claims a spot at an end of
      // it (turf: the more there are, the less room your wombat has).
      foes: invaders().map((n,i)=>{
        const side = i%2 ? 1 : -1, home = W/2 + side*(250 - 75*Math.floor(i/2));
        return { name:n.name, kind:kindOf(n), x:home, home, dir:-side,
                 crawl:0, wob:0, blink:0, face:0, next: t + 260 + i*140, wind:0, windMax:26, jump:0, walk:null };
      }),
      lobs:[], stolen:null
    });
    const bouncer = along('bouncer');
    if(bouncer){                                   // she shoos one rival off before you start
      const msg = evict(L.foes.find(f => !f.leaving), 'is shooed off by '+bouncer.name, true);
      if(msg) showToast('🛡 '+msg);
    }
    mode = MODE.LEVEL;
  }

  // invading rivals shuffle about up top and roll lettuce at your wombat;
  // what happens once it's eaten is the same as endless mode
  // A rival leaves the plank for the rest of the level. Returns the message
  // (quiet: let the caller show it, combined with others).
  function evict(f, verb, quiet){
    if(!f || f.leaving) return '';
    f.leaving = true; f.walk = null; f.wind = 0;
    f.leaveDir = f.home < W/2 ? -1 : 1;
    const msg = RIVAL_KINDS[f.kind].icon+' '+f.name+' '+verb+'!';
    if(!quiet) showToast(msg);
    return msg;
  }

  // What each kind of rival does when its wind-up finishes.
  function act(f){
    const dir = L.wombat.x < f.x ? -1 : 1;
    switch(f.kind){
      case 'roller': case 'rotter':                        // roll a leaf along the plank toward the wombat
        if(!L.lettuce && L.diarrheaTimer<=0)
          L.lettuce = { x:f.x + dir*30, y:topPlat.y-20, vy:0, vx:dir*2.6, landed:true, wob:0, eatScale:1, rotten: f.kind==='rotter' };
        break;
      case 'lobber': {                                     // lob a leaf down the field; catch it to send them off
        const tx = rand(120, W-120);
        L.lobs.push({ x:f.x, y:60, vx:(tx - f.x)/110, vy:-6, rot:0, owner:f });
        break;
      }
      case 'bully': f.walk = 'go'; break;                  // stride over and shove the wombat
      case 'stomper': f.jump = 30; break;                  // jump, then stomp on landing
      case 'thief': {                                      // snatch the top poop
        if(L.stack.length < 3 || L.banking || L.stolen) break;
        const top = L.stack.reduce((a, c) => (c.y - c.h/2 < a.y - a.h/2 ? c : a));
        L.stack.splice(L.stack.indexOf(top), 1);
        L.stolen = { x:L.plat.x + top.off, y:top.y, w:top.w, h:top.h, hue:top.hue, rot:top.rot||0,
                     fromX:L.plat.x + top.off, fromY:top.y, k:0, thief:f };
        WB.sfx('steal');
        break;
      }
      case 'plopper': {                                    // a bad cube
        const size = rand(32, 52);
        L.plops.push({ x:f.x + dir*10, y:110, w:size, h:size, vx:rand(-0.4,0.4), vy:0.4,
                       rot:rand(-0.15,0.15), vr:rand(-0.05,0.05), squish:1, hue:WB.BAD_HUE, bad:true });
        WB.sfx('plop');
        break;
      }
    }
  }
  function canAct(f){
    if(f.kind==='roller' || f.kind==='rotter') return !L.lettuce && L.diarrheaTimer<=0;
    if(f.kind==='thief') return L.stack.length >= 3 && !L.stolen;
    return true;
  }

  function updateHazards(){
    // turf: the wombat may only crawl between the innermost rivals
    const active = L.foes.filter(f => !f.leaving);
    L.crawlBound = active.length ? Math.max(70, Math.min(...active.map(f => Math.abs(f.home - W/2))) - 75) : 0;

    for(const f of L.foes){
      f.crawl += 0.16; f.wob = Math.sin(f.crawl)*3;
      if(f.blink>0) f.blink--; else if(Math.random()<0.01) f.blink=8;
      if(f.leaving){ f.x += f.leaveDir*5; f.face = f.leaveDir; continue; }
      if(f.jump > 0 && --f.jump === 0){                   // a Stomper lands
        L.shake = Math.max(L.shake, 9);
        if(L.stack.length) L.pileSwayV += (Math.random() < 0.5 ? -1 : 1) * 0.015;
        for(let k=0;k<8;k++) L.particles.push(WB.puff(f.x + rand(-20,20), topPlat.y - 8, '#c9a77a'));
        WB.sfx('stomp');
      }
      if(f.walk === 'go'){                                 // a Bully on the way over
        const dx = L.wombat.x - f.x;
        f.x += Math.sign(dx)*3; f.face = Math.sign(dx);
        if(Math.abs(dx) < 70){ L.wombat.shoveV = Math.sign(dx || 1)*9; f.walk = 'back'; WB.sfx('stomp'); }
        continue;
      }
      if(f.walk === 'back'){
        const dx = f.home - f.x;
        f.x += Math.sign(dx)*Math.min(2.5, Math.abs(dx)); f.face = Math.sign(dx);
        if(Math.abs(dx) < 1) f.walk = null;
        continue;
      }
      if(f.wind > 0){ if(--f.wind === 0) act(f); }
      else if(t >= f.next){
        const K = RIVAL_KINDS[f.kind];
        f.next = t + rand(K.every[0], K.every[1]);
        if(canAct(f)){ f.windMax = f.kind==='rotter' ? 12 : 26; f.wind = f.windMax; }   // wind-up first
      }
      f.face += ((L.wombat.x > f.x ? 1 : -1) - f.face) * 0.08;
    }
    L.foes = L.foes.filter(f => !f.leaving || (f.x > -90 && f.x < W+90));

    // a Bully's shove slides the wombat along the plank
    const wb = L.wombat;
    if(wb.shoveV){
      wb.x += wb.shoveV; wb.shoveV *= 0.85;
      if(Math.abs(wb.shoveV) < 0.3) wb.shoveV = 0;
      const bound = L.crawlBound || (topPlat.w/2 - 40);
      wb.x = clamp(wb.x, W/2 - bound, W/2 + bound);
    }

    // a Lobber's leaf: catch it on the platform or stack to snatch it
    for(let i=L.lobs.length-1;i>=0;i--){
      const g = L.lobs[i];
      g.vy += 0.236; g.x += g.vx; g.y += g.vy; g.rot += 0.08;
      if(g.vy > 0){
        const top = WB.supportHeightAt(L, g.x);
        if(isFinite(top) && g.y + 9 >= top && g.y - 9 < top + 24){
          L.lobs.splice(i,1); L.nuts += 3;
          for(let k=0;k<8;k++) L.particles.push({ x:g.x + rand(-10,10), y:top + rand(-6,6), vx:rand(-3,3), vy:rand(-4,-1),
            life:rand(14,24), max:24, r:rand(2,4), color:'#7cc743', kind:'splat', g:.25 });
          WB.sfx('crunch');
          evict(g.owner, 'storms off: lettuce snatched, +3 Gum Nuts');
          WB.stickers.note('lobs');
          continue;
        }
      }
      if(g.y > H - 64){
        for(let k=0;k<6;k++) L.particles.push({ x:g.x + rand(-8,8), y:H-70, vx:rand(-2,2), vy:rand(-3,-1),
          life:rand(12,22), max:22, r:rand(2,4), color:'#6cbf38', kind:'splat', g:.25 });
        L.lobs.splice(i,1);
      }
    }

    // a Thief carries its prize up, then flings it away
    if(L.stolen){
      const s = L.stolen; s.k += 1/40;
      if(s.k < 1){
        const e = s.k, tx = s.thief.x, ty = 40;
        s.x = s.fromX + (tx - s.fromX)*e; s.y = s.fromY + (ty - s.fromY)*e - Math.sin(e*Math.PI)*80; s.rot += 0.1;
      } else { s.x += (s.thief.home < W/2 ? -1 : 1)*14; s.y -= 3; s.rot += 0.3; }
      if(s.x < -80 || s.x > W + 80) L.stolen = null;
    }

    // the Gardener gets to the first lettuce before your wombat does
    const gardener = along('gardener');
    if(gardener && L.gardenerReady && L.lettuce){
      L.gardenerReady = false;
      for(let k=0;k<8;k++) L.particles.push({ x:L.lettuce.x + rand(-10,10), y:L.lettuce.y + rand(-6,6), vx:rand(-3,3), vy:rand(-3.5,-0.5),
        life:rand(12,24), max:24, r:rand(2,4), color:'#7cc743', kind:'splat', g:.25 });
      L.lettuce = null; WB.sfx('crunch');
      showToast('🌿 '+gardener.name+' ate the lettuce before your wombat could');
    }
    // mates sit in a row beside your wombat, on the roomier side (toward the
    // middle of the plank), so they never pile up at an end
    const side = L.wombat.x < W/2 ? 1 : -1, lim = (L.crawlBound || (topPlat.w/2 - 40)) + 40;
    L.party.forEach((m, i) => {
      const tx = clamp(L.wombat.x + side*64*(i+1), W/2 - lim - 20, W/2 + lim + 20);
      const dx = tx - m.x;
      m.x += dx*0.08; m.crawl += Math.abs(dx) > 2 ? 0.2 : 0.05; m.wob = Math.sin(m.crawl)*3;
      m.face += ((L.wombat.x > m.x ? 1 : -1)*0.7 - m.face)*0.1;
      if(m.blink>0) m.blink--; else if(Math.random()<0.008) m.blink=8;
    });

    // a caught bad cube rots into a puddle a couple of seconds later
    for(const c of L.stack) if(c.rotT && !c.melting && !c.melted && --c.rotT <= 0) WB.meltCube(L, c);

    WB.updateLettuceAndDiarrhea(L, t);
  }

  // The tower goes over, like in endless mode: the pile and anything in the air
  // tumbles straight down, then the result shows.
  function startTopple(){
    L.toppling = true;
    WB.stickers.note('topples');
    for(const c of L.stack){
      c.x = L.plat.x + c.off;
      c.vx = rand(-0.5, 0.5); c.vfall = rand(0, 1.2); c.spin = rand(-0.14, 0.14);
    }
    for(const p of L.plops){ p.vx = rand(-0.5, 0.5); p.vy = Math.max(p.vy||0, 0.5); p.vr = (p.vr||0) + rand(-0.14, 0.14); }
  }
  function updateTopple(){
    for(const c of L.stack){ c.vfall += 0.55; c.y += c.vfall; c.x += c.vx; c.rot = (c.rot||0) + c.spin; }
    for(const p of L.plops){ p.vy += WB.GRAV*3; p.y += p.vy; p.x += (p.vx||0); p.rot = (p.rot||0) + (p.vr||0); }
  }
  const TOPPLE_FRAMES = 50;   // how long the fall plays before the result card

  function updateLevel(){
    if(L.result){ L.resultT++; if(L.shake>0) L.shake*=0.85;
      if(L.toppling) updateTopple();
      if(L.resultT > (L.toppling ? TOPPLE_FRAMES + 70 : 70)) endLevel(L.result==='win'); return; }
    if(L.banking>0){
      L.banking--;
      for(const c of L.stack) c.y -= 3;
      for(const s of L.stars){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.15; s.life--; }
      L.stars = L.stars.filter(s=>s.life>0);
      if(L.banking===0){
        L.stack=[]; L.plops=[]; L.diarrhea=[]; L.pileSway=0; L.pileSwayV=0; L.pileSwayShown=0;
        L.nextSpawn = t+30;
        if(L.stacksDone >= L.stacksNeeded){ L.result='win'; L.resultT=0; WB.sfx('win'); }
      }
      return;
    }
    if(L.shake>0) L.shake*=0.85;
    if(L.comboFlash>0) L.comboFlash--;

    WB.steerPlatform(L, input);
    WB.updateWombat(L, t);
    updateHazards();
    WB.stepPlops(L);
    // the Acrobat flicks back a poop that has slid off the edge (once per stack)
    const acro = along('acrobat');
    if(acro && L.acroReady){
      const top = WB.platTop(L);
      const slid = L.plops.find(q => !q.bad && !q.collapsed && (q._boarded || q.contact > 0) && q.y - q.h/2 > top + 6);
      if(slid){
        L.acroReady = false;
        slid.x = L.plat.x; slid.y = WB.stackTopWorldY(L) - 90; slid.vx = 0; slid.vy = -2; slid.contact = 0; slid._boarded = false;
        WB.sfx('click'); showToast('🤸 '+acro.name+' flicked it back!');
      }
    }
    // the Drummer counts in each poop: three beats, then out it comes
    if(along('drummer') && L.wombat.mode === 'push' && [1, 9, 17].includes(L.wombat.timer - (L.M.pushAt - 24))){
      const n = [1, 9, 17].indexOf(L.wombat.timer);
      L.beat = { n: 3 - n, life: 8 }; WB.sfx('drum', n === 2);
    }
    if(L.beat && --L.beat.life <= 0) L.beat = null;

    const effOff = WB.updateStack(L, t);
    if(effOff !== null){
      const edge = L.plat.w/2 + L.margin, ratio = Math.abs(effOff)/edge;
      L.stackMaxRatio = Math.max(L.stackMaxRatio, ratio);
      if(L.M.slowmo && L.slowmoReady && ratio > 0.85){ L.slowmoReady = false; L.slowmoLeft = 150; showToast('⏳ Slow-mo!'); }
      if(ratio > 1){
        if(L.M.anchor && L.anchorReady){             // the Anchor upgrade catches it once per level
          L.anchorReady = false; L.pileSway = 0; L.pileSwayV = 0; L.shake = 10; WB.sfx('levelup'); showToast('⚓ Anchor held!');
        } else { L.result='lose'; L.loseWhy='topple'; L.resultT=0; L.shake=16; WB.sfx('topple'); startTopple(); }
      }
    }
    if(L.extendT > 0 && --L.extendT === 0) WB.setPlatBonus(L, 0);
    if(!L.result && L.stack.length && WB.stackTopWorldY(L) <= L.goalY){
      L.stacksDone++; L.banking=40;
      const notes = [];
      L.nuts += 5;                                   // a finished stack, and more if it never got wobbly
      if(L.stackMaxRatio < 0.8){ L.nuts += 10; notes.push('✨ Clean stack! +10 Gum Nuts'); WB.stickers.note('clean'); }
      if(L.foes.filter(f => !f.leaving).length >= 3) WB.stickers.note('siege');
      notes.push(evict(L.foes.find(f => !f.leaving), 'runs off', true));   // a finished stack scares one rival away
      if(notes.some(Boolean)) showToast(notes.filter(Boolean).join('   ·   '));
      L.stackMaxRatio = 0;
      if(L.M.extendo){ WB.setPlatBonus(L, 20); L.extendT = 300; }
      L.acroReady = !!along('acrobat');                // the Acrobat is ready again for the next stack
      WB.sfx('levelup'); tutorialDone();
      for(let k=0;k<16;k++) L.stars.push({ x:L.pileCOMx, y:L.goalY, vx:rand(-4,4), vy:rand(-6,-1),
        life:rand(24,44), col:['#ffe14d','#ff9ff3','#7bed9f','#70a1ff'][k%4] });
    }

    WB.updateParticles(L.particles);
  }

  function endLevel(success, retreat){
    const node = L.node;
    // Gum Nuts from the level, plus the bonus for winning it
    let nuts = L.nuts + (success && !retreat ? (node.type==='mate' ? 10 : 15) : 0);
    if(along('charmer')) nuts = Math.round(nuts * 1.25);
    WB.progress.earn(nuts);
    const nutNote = nuts ? '   ·   +'+nuts+' Gum Nuts' : '';
    if(retreat){
      // backing out costs the day, but not the full price of a loss
      if(node.type==='mate'){ player.charm = clamp(player.charm-6,0,charmGoal()); showToast('You slipped away from '+node.name+'.  -6 charm'+nutNote); }
      else { player.threat = clamp(player.threat+6,0,THREAT_MAX); showToast('You backed down from '+node.name+'.  +6 threat'+nutNote); }
    } else if(node.type==='mate'){
      if(success){
        player.charm = clamp(player.charm+22,0,charmGoal());
        const b = grantRandom(BUFFS, player.buffs);
        if(player.debuffs.length) player.debuffs.shift();
        const was = node.name, perk = MATE_KINDS[mateKindOf(node)];
        player.household.push({ name: was, kind: mateKindOf(node) });   // she moves into your burrow
        WB.stickers.note('mates'); WB.stickers.best('burrow', player.household.length);
        respawnNode(node);                       // and a newcomer takes her spot
        showToast(was+' is smitten and joins your burrow! '+perk.icon+' '+perk.name+'  ·  +22 charm'+(b?'  ·  '+b.icon+' '+b.name:'')+nutNote);
      } else showToast(node.name+' was unimpressed…'+nutNote);
    } else {
      if(success){
        player.threat = clamp(player.threat-18,0,THREAT_MAX);
        const was = node.name;
        WB.stickers.note('rivals');
        respawnNode(node);                       // driven off; a newcomer takes the spot
        showToast('You out-stacked '+was+'!  -18 threat'+nutNote);
      } else {
        player.threat = clamp(player.threat+12,0,THREAT_MAX);
        const d = grantRandom(DEBUFFS, player.debuffs);
        if(player.buffs.length) player.buffs.shift();
        showToast(node.name+' bullied you! +12 threat'+(d?'  ·  debuff: '+d.icon+' '+d.name:'')+nutNote);
      }
    }
    L=null;
    womb.x=homeNode.x; womb.y=homeNode.y+30;
    advanceDay();                                // may flip mode to WIN or LOSE
    if(mode===MODE.WIN) WB.sfx('win'); else if(mode===MODE.LOSE) WB.sfx('sad');
    if(mode===MODE.LEVEL) mode=MODE.OVERWORLD;
    // the day is resolved — persist it, or wipe the slot if the season just ended
    if(mode===MODE.OVERWORLD) saveGame(); else endSeason(mode===MODE.WIN);
  }
  function grantRandom(pool,list){
    const avail = pool.filter(b=>!list.includes(b.key));
    if(!avail.length) return null;
    const b = avail[(Math.random()*avail.length)|0];
    list.push(b.key); return b;
  }

  // =====================================================================
  //  RENDER
  // =====================================================================
  function drawSky(){ const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#9fd8ff'); g.addColorStop(1,'#d8f0ff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }

  function render(){
    // Re-assert the DPR transform every frame: resizing the canvas wipes context
    // state, and this makes the base transform immune to any save/restore drift.
    ctx.setTransform(disp.sx, 0, 0, disp.sy, 0, 0);
    ctx.clearRect(0,0,W,H);
    ctx.save();                  // so no drawing state leaks into the next frame
    if(mode===MODE.INTRO) drawIntro();
    else if(mode===MODE.LEVEL && L) drawLevel();
    else {
      drawOverworld();
      if(mode===MODE.WIN)  drawBanner('🏆 Season '+(seasonEnd ? seasonEnd.season : player.season-1)+' won! Your charm reigns.','#ffe14d');
      if(mode===MODE.LOSE) drawBanner('💀 Rivals overran your territory.','#ff8a8a');
    }
    if(choosing) drawPicker();
    else if(paused) drawPauseMenu();
    else if(canPause()) drawRoundButton(PAUSE_BTN, mode===MODE.LEVEL ? 'pause' : 'menu');
    if(onTitleScreen()){
      drawButton(BTN_MENU, '◂ Menu', '#fff8e7', '#7a3d12', 22);
      drawRoundButton(SOUND_BTN, WB.sound.muted() ? 'muted' : 'sound');
    }
    if(stickerShow) drawStickerToast(stickerShow.s, t - stickerShow.t0, 190);
    ctx.restore();

    // the controls hint sits over the bottom of the game, so it hides during a level
    const hintVis = mode===MODE.LEVEL && !paused ? 'hidden' : 'visible';
    if(hintEl.style.visibility !== hintVis) hintEl.style.visibility = hintVis;
  }

  // ---------- Pause / menu ----------
  // In a level the round button pauses; on the map it opens the same menu.
  const PAUSE_BTN  = { x:W-38, y:104, r:22 };
  // the pause screen's buttons, top to bottom; Retreat only inside a level
  function menuItems(){
    const items = [{ id:'resume', label:'▶ Resume', fill:'#7bed9f', edge:'#14532d' }];
    if(mode===MODE.LEVEL) items.push({ id:'retreat', label:'🏳 Retreat', fill:'#ffd98a', edge:'#7a3d12' });
    items.push({ id:'quit',  label:'🏠 Main menu', fill:'#fff8e7', edge:'#7a3d12' },
               { id:'sound', label: WB.sound.muted() ? '🔇 Sound: off' : '🔊 Sound: on', fill:'#fff8e7', edge:'#7a3d12' });
    return items.map((it, i) => ({ ...it, b:{ x:W/2-150, y:H*0.36 + i*78, w:300, h:62 } }));
  }
  const BTN_MENU   = { x:18, y:18, w:136, h:48 };     // intro + end-of-season screens
  const SOUND_BTN  = PAUSE_BTN;                       // intro + end-of-season screens
  const onTitleScreen = () => mode===MODE.INTRO || mode===MODE.WIN || mode===MODE.LOSE;
  let paused = false;

  const hintEl = document.getElementById('hint');
  hintEl.innerHTML = WB.isTouch
    ? 'Tap a wombat to travel there &nbsp;·&nbsp; drag to move the platform &nbsp;·&nbsp; ⏸ to pause'
    : 'Click a wombat to travel there &nbsp;·&nbsp; mouse or ← → / A D to move the platform &nbsp;·&nbsp; P to pause &nbsp;·&nbsp; M to mute';

  // First-ever level: point at the goal line until the first stack is done.
  const TUTORIAL_KEY = 'wombatCampaignTutorialDone';

  const canPause = () => (mode===MODE.LEVEL && L && !L.result) || mode===MODE.OVERWORLD;

  function drawPauseMenu(){

      ctx.fillText('Retreat ends this level: the day passes, but it isn\'t counted as a loss.', W/2, y); y += 24;
      ctx.fillText('Main menu keeps your season as it was this morning; the level replays.', W/2, y);
    } else {
      ctx.fillText('Your season is saved.', W/2, y);

        ctx.font='16px "Comic Neue", "Comic Sans MS", cursive';

        for(const m of shown){ const K = MATE_KINDS[m.kind]; y += 24; ctx.fillText(K.icon+'  '+m.name+', '+K.name+': '+K.desc, W/2, y); }

  function quitToMenu(){ saveGame(); WB.toMenu(); }

  // ---------- Who comes along? ----------
  // Tapping a wombat on the map, once you have mates in your burrow, asks who
  // comes along to the level (as many as you have seats; see the Workshop).
  let choosing = null;                       // { node, picked: [names] } while the picker is open
  function goTo(n){ travel = { node:n, fromX:womb.x, fromY:womb.y, toX:n.x, toY:n.y+30, p:0 }; mode = MODE.TRAVEL; }
  function openPicker(node){
    const names = player.household.map(m => m.name);
    choosing = { node, picked: player.party.filter(nm => names.includes(nm)).slice(0, WB.progress.seats()) };
  }
  function pickerLayout(){
    // up to 8: whoever is picked first, then the most recent arrivals
    const picked = player.household.filter(m => choosing.picked.includes(m.name));
    const rest = player.household.filter(m => !choosing.picked.includes(m.name)).reverse();
    const list = [...picked, ...rest].slice(0, 8);
    const top = 210, rowsY = top + 92;
    const rows = list.map((m, i) => ({ m, b:{ x:70, y:rowsY + i*56, w:W-140, h:48 } }));
    const by = rowsY + list.length*56 + 14;
    return { top, list, rows, h: by + 70 - top,
             go:{ x:W/2-226, y:by, w:216, h:56 }, cancel:{ x:W/2+10, y:by, w:216, h:56 } };
  }
  function drawPicker(){
    const P = pickerLayout(), seats = WB.progress.seats();
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff8e7'; ctx.strokeStyle='#7a3d12'; ctx.lineWidth=4;
    roundRect(50, P.top, W-100, P.h, 18); ctx.fill(); ctx.stroke();
    ctx.textAlign='center'; ctx.fillStyle='#5a2d0c'; ctx.font='bold 26px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillText('Who comes along to '+choosing.node.name+'?', W/2, P.top+42);
    ctx.font='16px "Comic Neue", "Comic Sans MS", cursive'; ctx.fillStyle='#7a3d12';
    ctx.fillText('Seats: '+choosing.picked.length+' / '+seats+'  ·  tap to choose'+(seats < 3 ? '  ·  more seats in the Workshop' : ''), W/2, P.top+68);
    for(const r of P.rows){
      const on = choosing.picked.includes(r.m.name), K = MATE_KINDS[r.m.kind];
      ctx.fillStyle = on ? '#e3f6d8' : '#fff'; ctx.strokeStyle = on ? '#3f8f3a' : '#c9a27a'; ctx.lineWidth = 3;
      roundRect(r.b.x, r.b.y, r.b.w, r.b.h, 12); ctx.fill(); ctx.stroke();
      ctx.textAlign='left'; ctx.font='22px serif'; ctx.fillStyle='#000'; ctx.fillText(K.icon, r.b.x+12, r.b.y+32);
      ctx.fillStyle='#5a2d0c'; ctx.font='bold 17px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText(r.m.name+' · '+K.name, r.b.x+46, r.b.y+21);
      ctx.fillStyle='#7a5a3a'; ctx.font='14px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText(K.desc, r.b.x+46, r.b.y+39);
      if(on){ ctx.textAlign='right'; ctx.fillStyle='#2f7a2a'; ctx.font='bold 20px "Comic Neue", "Comic Sans MS", cursive'; ctx.fillText('✓', r.b.x+r.b.w-14, r.b.y+31); }
    }
    drawButton(P.go, choosing.picked.length ? '▶ Go' : '▶ Go alone', '#7bed9f', '#14532d', 22);
    drawButton(P.cancel, 'Cancel', '#fff8e7', '#7a3d12', 22);
    ctx.textAlign='left';
  }
  function pickerTap(px, py){
    const P = pickerLayout();
    if(WB.hitBtn(P.go, px, py)){
      player.party = choosing.picked.slice(); const node = choosing.node; choosing = null;
      WB.sfx('click'); goTo(node); return;
    }
    if(WB.hitBtn(P.cancel, px, py)){ choosing = null; WB.sfx('click'); return; }
    const r = P.rows.find(r => WB.hitBtn(r.b, px, py));
    if(!r) return;
    const at = choosing.picked.indexOf(r.m.name);
    if(at >= 0) choosing.picked.splice(at, 1);
    else { choosing.picked.push(r.m.name); while(choosing.picked.length > WB.progress.seats()) choosing.picked.shift(); }
    WB.sfx('click');
  }

  function drawIntro(){
    drawSky();
    ctx.fillStyle='#6ab04c'; ctx.fillRect(0,H*0.62,W,H*0.38);

  const BTN_CONTINUE = { x:W/2-190, y:H*0.79,    w:380, h:62 };
  let confirmNewUntil = 0;       // "New campaign" asks for a second tap until this frame
  const BTN_NEW      = { x:W/2-190, y:H*0.79+74, w:380, h:62 };

  // a cartoon gum tree. The canopy's outline is its blobs stroked thick and
  // then filled over, so only the outer edge of the union shows.
  function drawTree(x,y){
    ctx.save();
    ctx.strokeStyle=WB.INK; ctx.lineWidth=3.5; ctx.lineJoin='round';
    ctx.fillStyle='#8a5a30'; ctx.fillRect(x-7,y,14,46); ctx.strokeRect(x-7,y,14,46);
    const blobs = [[x,y-6,30],[x-22,y+6,20],[x+22,y+6,20]];
    ctx.lineWidth=7; for(const [bx,by,r] of blobs){ ctx.beginPath(); ctx.arc(bx,by,r,0,7); ctx.stroke(); }
    ctx.fillStyle='#3f8f3a'; for(const [bx,by,r] of blobs){ ctx.beginPath(); ctx.arc(bx,by,r,0,7); ctx.fill(); }
    ctx.fillStyle='#57ab4a'; ctx.beginPath(); ctx.arc(x-8,y-16,12,0,7); ctx.fill();   // sunlit side
    ctx.restore();
  }

  function drawOverworld(){
    drawSky();
    ctx.fillStyle='#6ab04c'; ctx.fillRect(0,H*0.12,W,H);
    ctx.fillStyle='#5aa040';
    for(let i=0;i<40;i++){ const gx=(i*61+(i*i*13)%50), gy=H*0.12+(i*97%(H*0.85));
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+7,gy-14); ctx.lineTo(gx+14,gy); ctx.fill(); }
    drawTree(60,165); drawTree(W-62,165); drawTree(58,855);
    ctx.fillStyle='#7ec8ff'; ctx.beginPath(); ctx.ellipse(W-96,855,62,28,0,0,7); ctx.fill();
    ctx.strokeStyle=WB.INK; ctx.lineWidth=3.5; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.ellipse(W-110,848,30,10,0,Math.PI*1.1,Math.PI*1.6); ctx.stroke();

    // trails from the burrow out to each spot
    ctx.strokeStyle='rgba(120,85,45,.5)'; ctx.lineWidth=8; ctx.setLineDash([2,14]); ctx.lineCap='round';
    for(const n of nodes){ if(n===homeNode) continue;
      // the trail runs all the way out to wherever this wombat may wander
      const fx = n.type==='mate' ? n.awayX : n.homeX, fy = n.type==='mate' ? n.awayY : n.homeY;
      ctx.beginPath(); ctx.moveTo(homeNode.x,homeNode.y+8); ctx.lineTo(fx,fy+16); ctx.stroke(); }
    ctx.setLineDash([]);

    // home burrow
    ctx.strokeStyle=WB.INK; ctx.lineWidth=3.5; ctx.lineJoin='round';
    ctx.fillStyle='#7a5a38'; ctx.beginPath(); ctx.ellipse(homeNode.x,homeNode.y+4,52,16,0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#8a6440'; ctx.beginPath(); ctx.arc(homeNode.x,homeNode.y+2,34,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#2e1f12'; ctx.beginPath(); ctx.arc(homeNode.x,homeNode.y+2,18,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#3a2410'; ctx.font='bold 15px "Comic Neue", "Comic Sans MS", cursive'; ctx.textAlign='center';
    ctx.fillText('🏠 Home Burrow', homeNode.x, homeNode.y-44);

    for(const n of nodes){ if(n.type!=='home') drawNode(n); }

    // the player's wombat — striding when travelling, shuffling about at home
    const pRate = travel ? 0.2 : 0.11;
    const pCrawl = t*pRate;
    womb.bob = Math.sin(pCrawl)*2;
    drawWombatArt({ x:womb.x, y:womb.y-34+womb.bob,
      face: travel ? womb.dir*0.85 : Math.sin(t*0.015)*0.8, strain:0,
      crawl:pCrawl, wob:Math.sin(pCrawl)*3, mode:'crawl', timer:0,
      blink: (t % 210) < 8 ? 1 : 0 }, 0.42, PAL_PLAYER, {});

    drawOverworldHUD();
    if(toast){
      ctx.globalAlpha = clamp(toast.life/40,0,1);
      ctx.fillStyle='rgba(0,0,0,.72)'; roundRect(30,H*0.9-24,W-60,44,10); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 16px "Comic Neue", "Comic Sans MS", cursive'; ctx.textAlign='center';
      ctx.fillText(toast.text, W/2, H*0.9+4);
      ctx.globalAlpha=1;
    }
    ctx.textAlign='left';
  }

  function drawNode(n){
    const isRival = n.type==='rival';
    // which way this wombat is heading — rivals toward you, mates away
    const tgt = isRival ? {x:homeNode.x,y:homeNode.y} : {x:n.awayX,y:n.awayY};
    const heading = tgt.x >= n.x ? 1 : -1;
    const moving = n.delay<=0 && n.march<1;
    const fresh = n.march===0 && n.delay>0;            // newly moved in, still settling

    ctx.fillStyle = isRival ? (n.invader ? '#c0392b' : '#e06a4a') : '#ff9ec7';
    ctx.beginPath(); ctx.arc(n.x, n.y, 30+Math.sin(t*0.15+n.homeX)*2, 0, 7); ctx.fill();
    ctx.strokeStyle=WB.INK; ctx.lineWidth=3.5; ctx.stroke();

    // Always animate the legs: a marching wombat strides toward its goal, a
    // resting one shuffles and paces on the spot rather than freezing.
    const seed  = n.homeX + n.homeY;
    const rate  = moving ? 0.16 : 0.10;
    const crawl = t*rate + seed;
    const face  = moving ? heading*0.85 : Math.sin(t*0.012 + seed)*0.8;   // paces side to side
    const blink = ((t + seed|0) % 230) < 8 ? 1 : 0;
    drawWombatArt({ x:n.x, y:n.y-6, face, strain:0, crawl,
      wob: Math.sin(crawl)*(moving?3:2), mode:'crawl', timer:0, blink },
      0.34, isRival?PAL_RIVAL:PAL_MATE, { angry:isRival, love:!isRival });

    ctx.fillStyle = isRival ? '#8a2a12' : '#a12a63';
    ctx.font='bold 16px "Comic Neue", "Comic Sans MS", cursive'; ctx.textAlign='center';
    ctx.fillText((isRival?'😤 ':'💗 ')+n.name, n.x, n.y+46);
    ctx.fillStyle='#333'; ctx.font='13px "Comic Neue", "Comic Sans MS", cursive';
    const K = isRival ? RIVAL_KINDS[kindOf(n)] : MATE_KINDS[mateKindOf(n)];
    ctx.fillText(K.icon+' '+K.name+' · '+n.stacks+'× stack of '+n.target, n.x, n.y+62);
    if(isRival && !n.invader && inBurrow('sage')){
      // the Sage reads the land: days until this rival reaches you
      const days = n.delay + Math.ceil((1 - n.march)/n.speed - 1e-9);
      ctx.fillStyle='#5a3a8a'; ctx.font='bold 13px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText('🦉 reaches you in '+days+' day'+(days===1?'':'s'), n.x, n.y+78);
    } else if(isRival && n.invader){
      ctx.fillStyle='#c0392b'; ctx.font='bold 13px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText('⚠ IN YOUR TERRITORY', n.x, n.y+78);
    } else if(fresh){
      ctx.fillStyle='#3a6b1f'; ctx.font='13px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText('✨ just arrived', n.x, n.y+78);
    }
    // a little motion arrow shows which way they're headed
    if(moving){
      ctx.fillStyle = isRival ? '#8a2a12' : '#a12a63';
      ctx.font='bold 20px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText(heading>0?'▶':'◀', n.x + heading*46, n.y - 2 + Math.sin(t*0.2)*2);
    }
    ctx.textAlign='left';
  }

  function meter(x,y,w,h,frac,col,label){
    ctx.fillStyle='rgba(255,255,255,.6)'; roundRect(x,y,w,h,h/2); ctx.fill();
    ctx.save(); roundRect(x,y,w,h,h/2); ctx.clip();
    ctx.fillStyle=col; roundRect(x,y,Math.max(h,w*clamp(frac,0,1)),h,h/2); ctx.fill(); ctx.restore();
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; roundRect(x,y,w,h,h/2); ctx.stroke();
    ctx.fillStyle='#2d3a12'; ctx.font='bold 14px "Comic Neue", "Comic Sans MS", cursive'; ctx.textAlign='left';
    ctx.fillText(label, x+2, y-4);
  }
  function drawOverworldHUD(){

    meter(W-310,36,290,18, player.threat/THREAT_MAX, '#e0492b', '😤 Threat '+player.threat+'/'+THREAT_MAX);

  let effectChips = [];

  // first level only: what the goal line means
  function drawTutorial(){
    ctx.save();
    ctx.textAlign='center'; ctx.font='bold 22px "Comic Neue", "Comic Sans MS", cursive';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.fillStyle='#7a3d12';

  function drawLevel(){
    drawSky();
    ctx.save();
    ctx.translate(shakeX,shakeY);

    drawGround(L.plat);
    drawGoalLine(L.goalY);
    if(tutorial && !L.banking && !L.result) drawTutorial();
    // the Lookout's shadow: where the lowest falling poop (or the one about to drop) will land
    if(along('lookout')){
      const fall = L.plops.filter(q => !q.bad && !q.collapsed).sort((a, b) => b.y - a.y)[0];
      const sx = fall ? fall.x : L.wombat.mode === 'push' ? L.wombat.x : null;
      if(sx !== null){
        const rx = fall ? Math.max(16, fall.w*0.5) : 24;
        ctx.fillStyle = 'rgba(42,28,18,.45)';
        ctx.beginPath(); ctx.ellipse(sx, L.plat.y + 16, rx, 7, 0, 0, 7); ctx.fill();
        // a little marker over the spot, bobbing
        const my = L.plat.y + 2 + Math.sin(t*0.25)*3;
        ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = WB.INK; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(sx - 8, my - 12); ctx.lineTo(sx + 8, my - 12); ctx.lineTo(sx, my); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
    drawPlatform(L.plat);
    drawStack(L, !L.toppling);
    for(const p of L.plops){ drawTrail(p); drawPoop(p.x,p.y,p.w,p.h,p.rot,p.squish,p.hue); }
    drawDiarrhea(L.diarrhea, L.camOffset);
    for(const s of L.stars){ ctx.globalAlpha=clamp(s.life/20,0,1); ctx.fillStyle=s.col;
      ctx.beginPath(); ctx.arc(s.x,s.y,5,0,7); ctx.fill(); }
    ctx.globalAlpha=1;

    drawTopPlat(0);

    // invading rivals up on the plank with your wombat, each wearing its personality
    for(const f of L.foes){
      const K = RIVAL_KINDS[f.kind];
      const windUp = f.wind>0 ? Math.sin((f.windMax-f.wind)/f.windMax*Math.PI)*10 : 0;
      const hopY = f.jump>0 ? Math.sin((1 - f.jump/30)*Math.PI)*30 : 0;
      drawWombatArt({ x:f.x, y:70 - hopY, face:f.face, strain:0, crawl:f.crawl, wob:f.wob-windUp,
        mode:'crawl', timer:0, blink:f.blink }, 0.8, PAL_RIVAL, { angry:true });
      ctx.font='20px serif'; ctx.textAlign='center';
      ctx.fillText(K.icon, f.x + 34, 30 - hopY);
      if(f.wind>0) ctx.fillText(f.kind==='plopper' ? '💢' : f.kind==='thief' ? '🖐' : K.icon, f.x + (L.wombat.x<f.x?-38:38), 44);
      ctx.textAlign='left';
    }
    for(const g of L.lobs) drawLettuce({ x:g.x, y:g.y, wob:0, eatScale:1, roll:g.rot }, 0);
    if(L.stolen) drawPoop(L.stolen.x, L.stolen.y, L.stolen.w, L.stolen.h, L.stolen.rot, 1, L.stolen.hue);
    drawLettuce(L.lettuce, 0);
    for(const m of L.party){
      drawWombatArt({ x:m.x, y:84, face:m.face, strain:0, crawl:m.crawl, wob:m.wob, mode:'crawl', timer:0, blink:m.blink }, 0.62, PAL_MATE, {});
      ctx.font='18px serif'; ctx.textAlign='center'; ctx.fillText(MATE_KINDS[m.kind].icon, m.x + 24, 50); ctx.textAlign='left';
    }
    drawWombatArt(L.wombat, 1, PAL_PLAYER, {});
    if(L.beat){                                     // the Drummer's count-in
      ctx.save(); ctx.globalAlpha = L.beat.life/8; ctx.textAlign='center';
      ctx.font='bold 34px "Comic Neue", "Comic Sans MS", cursive'; ctx.lineWidth=5; ctx.strokeStyle='rgba(42,28,18,.8)'; ctx.fillStyle='#ffe14d';
      ctx.strokeText(String(L.beat.n), L.wombat.x, 168); ctx.fillText(String(L.beat.n), L.wombat.x, 168);
      ctx.restore();
    }
    drawParticles(L.particles);

    ctx.restore();

    // HUD, in the grass strip at the bottom: the top of the screen belongs to
    // your wombat and any rivals on the plank (each wears its personality icon)
    const who = (L.node.type==='mate'?'💗 Impress ':'😤 Out-stack ')+L.node.name;
    const tall = Math.round((WB.platTop(L)-WB.stackTopWorldY(L))/42);
    const stackTxt = 'stack '+Math.min(L.stacksDone+1,L.stacksNeeded)+' / '+L.stacksNeeded+'   ·   height '+tall+' / '+L.target;
    const hudText = (txt, x, y, font, align) => {
      ctx.font = font; ctx.textAlign = align || 'left';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,50,15,.85)'; ctx.lineJoin = 'round';
      ctx.strokeText(txt, x, y); ctx.fillStyle = '#fff'; ctx.fillText(txt, x, y);
    };
    hudText(who, 16, H-36, 'bold 22px "Comic Neue", "Comic Sans MS", cursive');
    hudText(stackTxt, 16, H-11, 'bold 17px "Comic Neue", "Comic Sans MS", cursive');
    const nx = 16 + ctx.measureText(stackTxt).width + 22;
    drawGumNut(nx, H-16, 18);
    hudText(String(L.nuts), nx + 12, H-11, 'bold 17px "Comic Neue", "Comic Sans MS", cursive');
    ctx.textAlign='right'; ctx.font='24px serif';
    let s2=''; for(let i=0;i<L.maxMiss;i++) s2 += i<L.maxMiss-L.misses ? '🧻' : '❌';
    ctx.fillText(s2, W-14, H-30); ctx.textAlign='left';

    // messages during the level (clean stack, a rival running off, upgrades kicking in)
    if(toast){
      ctx.globalAlpha = clamp(toast.life/40,0,1);
      ctx.font='bold 16px "Comic Neue", "Comic Sans MS", cursive';
      const tw = Math.min(W-40, ctx.measureText(toast.text).width + 36);
      ctx.fillStyle='rgba(0,0,0,.72)'; roundRect(W/2 - tw/2, 168, tw, 40, 12); ctx.fill();
      ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(toast.text, W/2, 194);
      ctx.globalAlpha=1; ctx.textAlign='left';
    }

    if(L.banking>0){
      ctx.textAlign='center'; ctx.fillStyle='#2d5016'; ctx.font='bold 40px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText('✅ Stack complete!', W/2, H*0.42);
      if(L.stacksDone < L.stacksNeeded){ ctx.font='20px "Comic Neue", "Comic Sans MS", cursive';
        ctx.fillText((L.stacksNeeded-L.stacksDone)+' to go — start a fresh stack!', W/2, H*0.42+34); }
      ctx.textAlign='left';
    }
    if(L.result && (!L.toppling || L.resultT > TOPPLE_FRAMES)){
      ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      const win=L.result==='win';
      const title = win ? (L.node.type==='mate' ? '💗 Impressed!' : '😤 Driven off!')
                        : (L.loseWhy==='misses' ? '🧻 Out of toilet paper!' : '🗼 TIMBERRR!');
      ctx.fillStyle=win?'#7bed9f':'#ff8a8a'; ctx.font='bold 44px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText(title, W/2, H/2-10);
      ctx.fillStyle='#fff'; ctx.font='20px "Comic Neue", "Comic Sans MS", cursive';
      ctx.fillText(win ? 'Well stacked!' : L.loseWhy==='misses' ? 'Too many poops hit the ground…' : 'The tower toppled…', W/2, H/2+28);
      let earned = L.nuts + (win ? (L.node.type==='mate' ? 10 : 15) : 0);
      if(along('charmer')) earned = Math.round(earned * 1.25);
      if(earned){ ctx.fillStyle='#ffd98a'; ctx.font='bold 22px "Comic Neue", "Comic Sans MS", cursive';
        ctx.fillText('+'+earned+' Gum Nuts', W/2, H/2+64); }
      ctx.textAlign='left';
    }
  }

  function drawBanner(text,col){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle=col; ctx.font='bold 38px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillText(text, W/2, H/2-10);
    ctx.fillStyle='#fff'; ctx.font='22px "Comic Neue", "Comic Sans MS", cursive';
    const e = seasonEnd || { won: mode===MODE.WIN, season: player.season, day: player.day, charm: player.charm, threat: player.threat };
    ctx.fillText('Day '+e.day+'  ·  💗 '+e.charm+'   😤 '+e.threat, W/2, H/2+30);
    ctx.font='18px "Comic Neue", "Comic Sans MS", cursive'; ctx.fillStyle='#ffe9b8';
    ctx.fillText(e.won ? 'Season '+player.season+' needs '+charmGoal()+' charm, and the rivals are tougher.'
                       : 'Your burrow stays with you'+(player.household.length ? ' ('+player.household.length+' mate'+(player.household.length>1?'s':'')+').' : '.'), W/2, H/2+64);
    ctx.fillStyle='#7bed9f'; ctx.font='bold 24px "Comic Neue", "Comic Sans MS", cursive';
    ctx.fillText(e.won ? '▶ Tap to start season '+player.season : '▶ Tap to try season '+player.season+' again', W/2, H/2+108);
    ctx.textAlign='left';
  }

  // =====================================================================
  //  UPDATE / INPUT
  // =====================================================================
  function update(){
    // Slow-Mo upgrade: the level runs at half speed for a moment
    if(!paused && mode===MODE.LEVEL && L && L.slowmoLeft > 0){ L.slowmoLeft--; if(L.slowmoLeft % 2) return; }
    t++;
    if(toast){ toast.life--; if(toast.life<=0) toast=null; }
    // a newly earned sticker gets a few seconds on screen, once you're not mid-level
    if(stickerShow && t - stickerShow.t0 > 240) stickerShow = null;
    if(!stickerShow && (mode !== MODE.LEVEL || !L || L.result || paused)){ const s = WB.stickers.next(); if(s){ stickerShow = { s, t0: t }; WB.sfx('win'); } }
    if(paused) return;
    if(mode===MODE.TRAVEL){
      travel.p += 0.035;
      const e = clamp(travel.p,0,1);
      womb.x = travel.fromX + (travel.toX-travel.fromX)*e;
      womb.y = travel.fromY + (travel.toY-travel.fromY)*e - Math.sin(e*Math.PI)*26;
      womb.dir = travel.toX > travel.fromX ? 1 : -1;
      if(travel.p>=1){ const node=travel.node; travel=null; startLevel(node); }
    } else if(mode===MODE.LEVEL && L) updateLevel();
    // rolled here rather than in render(), which can run more than once a step
    if(mode===MODE.LEVEL && L){ shakeX=(Math.random()-0.5)*L.shake; shakeY=(Math.random()-0.5)*L.shake; }
  }

  const input = { keys:{}, pointerX:null };
  window.addEventListener('keydown', e=>{ input.keys[e.key.toLowerCase()]=true;
    if([' ','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
    if(choosing){ if(e.key==='Escape') choosing = null; return; }
    if((e.key.toLowerCase()==='p' || e.key==='Escape') && (paused || canPause())) paused = !paused;
    if(e.key.toLowerCase()==='m') WB.sound.toggle(); });
  window.addEventListener('keyup', e=> input.keys[e.key.toLowerCase()]=false);
  const canvasPt = (cx,cy) => WB.canvasPt(cv, cx, cy);
  function onDown(px,py){
    if(choosing){ pickerTap(px, py); return; }
    if(paused){
      const hit = menuItems().find(it => WB.hitBtn(it.b, px, py));
      if(!hit) return;
      if(hit.id==='resume'){ paused = false; WB.sfx('click'); }
      else if(hit.id==='retreat'){ paused = false; WB.sfx('click'); endLevel(false, true); }
      else if(hit.id==='quit') quitToMenu();
      else if(hit.id==='sound') WB.sound.toggle();
      return;
    }
    if(canPause() && WB.hitRound(PAUSE_BTN,px,py)){ paused = true; WB.sfx('click'); return; }
    if(mode===MODE.LEVEL){ input.pointerX = px; return; }
    if(onTitleScreen() && WB.hitRound(SOUND_BTN,px,py)){ WB.sound.toggle(); return; }
    if(onTitleScreen() && WB.hitBtn(BTN_MENU,px,py)){ WB.toMenu(); return; }
    if(mode===MODE.INTRO){
      if(pendingSave){
        // with a save on offer the screen is a menu, so ignore taps off the buttons
        if(WB.hitBtn(BTN_CONTINUE,px,py)){ const d=pendingSave; pendingSave=null; restoreGame(d); }
        else if(WB.hitBtn(BTN_NEW,px,py)){
          // starting over loses your burrow and season, so it takes a second tap
          if(confirmNewUntil > t){ pendingSave=null; newGame(); }
          else { confirmNewUntil = t + 180; WB.sfx('click'); }
        }
        return;
      }
      newGame(); return;
    }
    if(mode===MODE.WIN||mode===MODE.LOSE){ seasonEnd = null; mode = MODE.OVERWORLD; WB.sfx('click'); return; }
    if(mode===MODE.OVERWORLD){
      const chip = effectChips.find(c => WB.hitBtn(c.b, px, py));
      if(chip){ showToast(chip.e.icon+'  '+chip.e.name+' ('+(chip.good ? 'buff' : 'debuff')+'): '+chip.e.desc.toLowerCase()); WB.sfx('click'); return; }
      for(const n of nodes){ if(n.type==='home'||n.state!=='open') continue;
        if(Math.hypot(px-n.x,py-n.y)<42){
          WB.sfx('click');
          if(player.household.length) openPicker(n); else goTo(n);
          return;
        } }
    }
  }
  cv.addEventListener('mousedown', e=>{ const p=canvasPt(e.clientX,e.clientY); onDown(p.x,p.y); });
  cv.addEventListener('mousemove', e=>{ if(mode===MODE.LEVEL){ input.pointerX=canvasPt(e.clientX,e.clientY).x; } });
  cv.addEventListener('mouseleave', ()=> input.pointerX=null);
  cv.addEventListener('touchstart', e=>{ const p=canvasPt(e.touches[0].clientX,e.touches[0].clientY);
    onDown(p.x,p.y); e.preventDefault(); }, {passive:false});
  cv.addEventListener('touchmove', e=>{ const p=canvasPt(e.touches[0].clientX,e.touches[0].clientY);
    if(mode===MODE.LEVEL) input.pointerX=p.x; e.preventDefault(); }, {passive:false});

  // Mobile webviews get killed while backgrounded and never see 'unload', so
  // flush on the events that do fire first.
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveGame(); });
  window.addEventListener('pagehide', saveGame);
  // switching away mid-level pauses it, so nothing falls while nobody's looking
  WB.onAway(()=>{ if(mode===MODE.LEVEL && L && !L.result) paused = true; });

  buildMap();
  WB.runLoop(update, render);
})();
</script>
